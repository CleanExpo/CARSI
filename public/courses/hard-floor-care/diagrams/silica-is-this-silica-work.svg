<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Is this silica work? Two questions before the machine starts</title>
<desc id="d">Question one: does the material contain crystalline silica, such as concrete, brick, stone, porcelain, tile, terrazzo or cement-based grout? Check the SDS or supplier data; if unknown, CARSI treats it as yes. Question two: will a power tool drill, cut, grind, sand or abrasive-polish it? If both are yes, in Australia it is processing a crystalline silica substance and must be controlled processing with a written high-risk assessment; in New Zealand you must eliminate or minimise respirable silica dust and monitor exposure if unsure. If either answer is no, carry on with the normal pre-job check.</desc>
<rect width="800" height="470" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Is this silica work? Two questions before the machine starts</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef3"/></linearGradient>
<linearGradient id="gWarn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#fde6c8"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3fbf7"/><stop offset="1" stop-color="#d3eee2"/></linearGradient>
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fc"/><stop offset="1" stop-color="#d6e5f2"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6f5"/><stop offset="1" stop-color="#f9d7d3"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dx="0" dy="3" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="24" y="64" width="752" height="85" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="88" font-size="14" font-weight="700" fill="#1f2933">1. Does the material contain crystalline silica?</text>
<text x="40" y="107" font-size="12" fill="#1f2933">Concrete, brick, stone, porcelain, tile, terrazzo and cement-based grout can all contain it.</text>
<text x="40" y="124" font-size="12" fill="#1f2933">Check the SDS or supplier data. If you cannot tell, CARSI treats it as yes.</text>
<line x1="400" y1="151" x2="400" y2="180" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="410" y="171" font-size="12" font-weight="700" fill="#52606d">Yes</text>
<rect x="24" y="182" width="752" height="85" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="206" font-size="14" font-weight="700" fill="#1f2933">2. Will a power tool drill, cut, grind, sand or abrasive-polish it?</text>
<text x="40" y="225" font-size="12" fill="#1f2933">Grout removal with a multi-tool, diamond honing on a rotary machine, drilling for a door stop,</text>
<text x="40" y="242" font-size="12" fill="#1f2933">cutting a tile: all of these count. Hand washing a sealed floor does not.</text>
<line x1="220" y1="269" x2="220" y2="304" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="230" y="292" font-size="12" font-weight="700" fill="#52606d">Yes</text>
<line x1="590" y1="269" x2="590" y2="304" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="292" font-size="12" font-weight="700" fill="#52606d">No to either</text>
<rect x="24" y="306" width="400" height="112" rx="10" fill="url(#gRed)" stroke="#b42318" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="330" font-size="14" font-weight="700" fill="#1f2933">Silica work: stop and set up controls</text>
<text x="40" y="349" font-size="12" fill="#1f2933">Australia: CSS processing. Controlled processing,</text>
<text x="40" y="366" font-size="12" fill="#1f2933">and a written check of whether it is high risk.</text>
<text x="40" y="383" font-size="12" fill="#1f2933">New Zealand: eliminate or minimise the dust;</text>
<text x="40" y="400" font-size="12" fill="#1f2933">monitor exposure if you are not certain.</text>
<rect x="448" y="306" width="328" height="112" rx="10" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="2" filter="url(#sh)"/>
<text x="464" y="330" font-size="14" font-weight="700" fill="#1f2933">Not silica work</text>
<text x="464" y="349" font-size="12" fill="#1f2933">Carry on with the normal pre-job check.</text>
<text x="464" y="366" font-size="12" fill="#1f2933">Ask again if the method changes</text>
<text x="464" y="383" font-size="12" fill="#1f2933">(for example, a pad becomes a diamond).</text>
<text x="776" y="450" font-size="12" fill="#52606d" text-anchor="end">CARSI · Hard Floor Care · silica decision · schematic, not to scale</text>
</svg>

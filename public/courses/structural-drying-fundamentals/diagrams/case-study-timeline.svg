<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Christchurch winter loss: the whole job</title>
<desc id="d">Timeline of a Christchurch winter drying job over six days: day one assess, asbestos sample, references and set-up with desiccant and electric heat; days two to four monitor and adjust; day five materials at dry standard; day six verify, document and hand over.</desc>
<rect width="800" height="510" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Christchurch winter loss: the whole job</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b6e4f"/></marker>
<marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b54708"/></marker>
<marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef3"/></linearGradient>
<linearGradient id="gWarn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#fde6c8"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3fbf7"/><stop offset="1" stop-color="#d3eee2"/></linearGradient>
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fc"/><stop offset="1" stop-color="#d6e5f2"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6f5"/><stop offset="1" stop-color="#f9d7d3"/></linearGradient>
<linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcebf7"/><stop offset="1" stop-color="#b9d6ee"/></linearGradient>
<radialGradient id="gDot" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#2fa77c"/><stop offset="1" stop-color="#0a5c42"/></radialGradient>
<radialGradient id="gDotW" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#e07a2c"/><stop offset="1" stop-color="#8f3806"/></radialGradient>
<radialGradient id="gDotB" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#4b8cc0"/><stop offset="1" stop-color="#174a6e"/></radialGradient>
<radialGradient id="gDotR" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#d0564a"/><stop offset="1" stop-color="#912018"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dx="0" dy="3" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="24" y="64" width="170" height="154" rx="10" fill="url(#gRed)" stroke="#b42318" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="88" font-size="14" font-weight="700" fill="#1f2933">Day 1</text>
<text x="40" y="107" font-size="12" fill="#1f2933">Make safe. Asbestos</text>
<text x="40" y="124" font-size="12" fill="#1f2933">sampling (1978</text>
<text x="40" y="141" font-size="12" fill="#1f2933">house). References.</text>
<text x="40" y="158" font-size="12" fill="#1f2933">Closed drying with</text>
<text x="40" y="175" font-size="12" fill="#1f2933">desiccant and</text>
<text x="40" y="192" font-size="12" fill="#1f2933">electric heat.</text>
<rect x="218" y="64" width="170" height="154" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="2" filter="url(#sh)"/>
<text x="234" y="88" font-size="14" font-weight="700" fill="#1f2933">Days 2 to 4</text>
<text x="234" y="107" font-size="12" fill="#1f2933">Monitor. Lounge</text>
<text x="234" y="124" font-size="12" fill="#1f2933">heated to 20 °C.</text>
<text x="234" y="141" font-size="12" fill="#1f2933">Timber floor stalls</text>
<text x="234" y="158" font-size="12" fill="#1f2933">on day 3: focus heat</text>
<text x="234" y="175" font-size="12" fill="#1f2933">and airflow there.</text>
<rect x="412" y="64" width="170" height="154" rx="10" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="2" filter="url(#sh)"/>
<text x="428" y="88" font-size="14" font-weight="700" fill="#1f2933">Day 5</text>
<text x="428" y="107" font-size="12" fill="#1f2933">Every mapped point</text>
<text x="428" y="124" font-size="12" fill="#1f2933">reaches its reference</text>
<text x="428" y="141" font-size="12" fill="#1f2933">reading.</text>
<rect x="606" y="64" width="170" height="154" rx="10" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="2" filter="url(#sh)"/>
<text x="622" y="88" font-size="14" font-weight="700" fill="#1f2933">Day 6</text>
<text x="622" y="107" font-size="12" fill="#1f2933">Verify, complete the</text>
<text x="622" y="124" font-size="12" fill="#1f2933">file, hand over a</text>
<text x="622" y="141" font-size="12" fill="#1f2933">plain-English</text>
<text x="622" y="158" font-size="12" fill="#1f2933">summary.</text>
<line x1="196" y1="141" x2="219" y2="141" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="390" y1="141" x2="413" y2="141" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="584" y1="141" x2="607" y2="141" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="238" width="234.66666666666666" height="127" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="262" font-size="14" font-weight="700" fill="#1f2933">Arrival</text>
<text x="40" y="284" font-size="16" font-weight="700" fill="#1f5f8b">12 °C, 85 %RH</text>
<text x="40" y="305" font-size="12" fill="#1f2933">7.4 g/kg, dew point 9.6 °C. A</text>
<text x="40" y="322" font-size="12" fill="#1f2933">refrigerant coil would run near</text>
<text x="40" y="339" font-size="12" fill="#1f2933">freezing.</text>
<rect x="282.66666666666663" y="238" width="234.66666666666666" height="127" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<text x="298.66666666666663" y="262" font-size="14" font-weight="700" fill="#1f2933">Heated</text>
<text x="298.66666666666663" y="284" font-size="16" font-weight="700" fill="#1f5f8b">20 °C, 60 %RH</text>
<text x="298.66666666666663" y="305" font-size="12" fill="#1f2933">8.7 g/kg: heat is driving</text>
<text x="298.66666666666663" y="322" font-size="12" fill="#1f2933">evaporation, as planned.</text>
<rect x="541.3333333333333" y="238" width="234.66666666666666" height="127" rx="10" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="2" filter="url(#sh)"/>
<text x="557.3333333333333" y="262" font-size="14" font-weight="700" fill="#1f2933">Target</text>
<text x="557.3333333333333" y="284" font-size="16" font-weight="700" fill="#0b6e4f">20 °C, 45 %RH</text>
<text x="557.3333333333333" y="305" font-size="12" fill="#1f2933">6.5 g/kg in the unaffected</text>
<text x="557.3333333333333" y="322" font-size="12" fill="#1f2933">bedroom.</text>
<rect x="24" y="385" width="752" height="69" rx="10" fill="url(#gCard)" stroke="#52606d" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="409" font-size="14" font-weight="700" fill="#1f2933">Desiccant check</text>
<text x="40" y="428" font-size="12" fill="#1f2933">500 m³/h × 1.2 × (7.4 − 3.0) g/kg × 24 ÷ 1000 = about 63 L/day.</text>
<text x="776" y="498" font-size="12" fill="#52606d" text-anchor="end">CARSI · Structural Drying Practitioner · schematic, not to scale</text>
</svg>

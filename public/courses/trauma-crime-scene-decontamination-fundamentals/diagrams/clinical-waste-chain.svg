<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 436" width="800" height="436" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Clinical waste: the chain of custody</title>
<desc id="d">Package and label on site (bags no more than two-thirds full, labelled to AS/NZS 3816, sharps in rigid containers), hand to a licensed transporter, track the load, deliver to a lawful facility. New South Wales: special waste, rigid lidded transport containers, no compaction vehicle, tracking for Schedule 1 waste. Victoria: R100 reportable priority waste, permitted transporter, Waste Tracker; exemption only under 50 litres and for no fee. New Zealand: NZS 4304:2002 and regional and district council rules.</desc>
<rect width="800" height="436" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Clinical waste: the chain of custody</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef3"/></linearGradient>
<linearGradient id="gWarn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#fde6c8"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3fbf7"/><stop offset="1" stop-color="#d3eee2"/></linearGradient>
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fc"/><stop offset="1" stop-color="#d6e5f2"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6f5"/><stop offset="1" stop-color="#f9d7d3"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dx="0" dy="3" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="24" y="64" width="170" height="106" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="1.5" filter="url(#sh)"/>
<text x="38" y="88" font-size="13" font-weight="700" fill="#1f2933">Package and label</text>
<text x="38" y="110" font-size="12" fill="#1f2933">Bags two-thirds full</text>
<text x="38" y="126" font-size="12" fill="#1f2933">at most (72 L bag =</text>
<text x="38" y="142" font-size="12" fill="#1f2933">48 L); AS/NZS 3816</text>
<text x="38" y="158" font-size="12" fill="#1f2933">label</text>
<rect x="218" y="64" width="170" height="106" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="1.5" filter="url(#sh)"/>
<text x="232" y="88" font-size="13" font-weight="700" fill="#1f2933">Licensed</text>
<text x="232" y="106" font-size="13" font-weight="700" fill="#1f2933">transporter</text>
<text x="232" y="128" font-size="12" fill="#1f2933">Rigid, lidded,</text>
<text x="232" y="144" font-size="12" fill="#1f2933">leak-proof containers</text>
<rect x="412" y="64" width="170" height="106" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="1.5" filter="url(#sh)"/>
<text x="426" y="88" font-size="13" font-weight="700" fill="#1f5f8b">Track the load</text>
<text x="426" y="110" font-size="12" fill="#1f2933">Documents follow</text>
<text x="426" y="126" font-size="12" fill="#1f2933">every change of hands</text>
<rect x="606" y="64" width="170" height="106" rx="10" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="1.5" filter="url(#sh)"/>
<text x="620" y="88" font-size="13" font-weight="700" fill="#0b6e4f">Lawful facility</text>
<text x="620" y="110" font-size="12" fill="#1f2933">Only a place</text>
<text x="620" y="126" font-size="12" fill="#1f2933">authorised to receive</text>
<text x="620" y="142" font-size="12" fill="#1f2933">it</text>
<line x1="196" y1="117.0" x2="216" y2="117.0" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="390" y1="117.0" x2="410" y2="117.0" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="584" y1="117.0" x2="604" y2="117.0" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="198" width="234" height="138" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="1.5" filter="url(#sh)"/>
<text x="38" y="222" font-size="13" font-weight="700" fill="#8f3806">New South Wales</text>
<text x="38" y="244" font-size="12" fill="#1f2933">Clinical and related waste is</text>
<text x="38" y="260" font-size="12" fill="#1f2933">special waste.</text>
<text x="38" y="276" font-size="12" fill="#1f2933">No compaction vehicle in</text>
<text x="38" y="292" font-size="12" fill="#1f2933">transport.</text>
<text x="38" y="308" font-size="12" fill="#1f2933">Track Schedule 1 hazardous</text>
<text x="38" y="324" font-size="12" fill="#1f2933">waste.</text>
<rect x="282" y="198" width="234" height="138" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="1.5" filter="url(#sh)"/>
<text x="296" y="222" font-size="13" font-weight="700" fill="#8f3806">Victoria</text>
<text x="296" y="244" font-size="12" fill="#1f2933">R100: reportable priority</text>
<text x="296" y="260" font-size="12" fill="#1f2933">waste.</text>
<text x="296" y="276" font-size="12" fill="#1f2933">High-risk transport permit and</text>
<text x="296" y="292" font-size="12" fill="#1f2933">Waste Tracker.</text>
<text x="296" y="308" font-size="12" fill="#1f2933">Exempt only under 50 L and for</text>
<text x="296" y="324" font-size="12" fill="#1f2933">no fee.</text>
<rect x="540" y="198" width="234" height="138" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="1.5" filter="url(#sh)"/>
<text x="554" y="222" font-size="13" font-weight="700" fill="#8f3806">New Zealand</text>
<text x="554" y="244" font-size="12" fill="#1f2933">NZS 4304:2002 healthcare</text>
<text x="554" y="260" font-size="12" fill="#1f2933">waste.</text>
<text x="554" y="276" font-size="12" fill="#1f2933">Regional and district council</text>
<text x="554" y="292" font-size="12" fill="#1f2933">plans.</text>
<text x="554" y="308" font-size="12" fill="#1f2933">Check the trade waste bylaw</text>
<text x="554" y="324" font-size="12" fill="#1f2933">before any drain.</text>
<rect x="24" y="360" width="752" height="36" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="1.5"/>
<text x="38" y="384" font-size="12" fill="#1f2933">Qld, WA, SA, Tas, NT and the ACT set their own rules: check your EPA and contractor before the job.</text>
<text x="776" y="424" font-size="12" fill="#52606d" text-anchor="end">CARSI · Trauma &amp; Biohazard Decontamination Practitioner · schematic, not to scale</text>
</svg>

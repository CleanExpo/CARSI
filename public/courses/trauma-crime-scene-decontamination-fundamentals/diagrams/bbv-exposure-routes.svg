<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" width="800" height="456" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Blood-borne viruses and how exposure happens</title>
<desc id="d">Hepatitis B, hepatitis C and HIV spread when infected blood or body fluids pass from one person to another. Standard precautions are the barrier on every job. The three work exposure routes are a sharps injury, a splash to the eyes, nose or mouth, and contact with non-intact skin, each with its barrier.</desc>
<rect width="800" height="456" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Blood-borne viruses and how exposure happens</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef3"/></linearGradient>
<linearGradient id="gWarn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#fde6c8"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3fbf7"/><stop offset="1" stop-color="#d3eee2"/></linearGradient>
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fc"/><stop offset="1" stop-color="#d6e5f2"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6f5"/><stop offset="1" stop-color="#f9d7d3"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dx="0" dy="3" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="24" y="64" width="232" height="90" rx="10" fill="url(#gRed)" stroke="#b42318" stroke-width="1.5" filter="url(#sh)"/>
<text x="38" y="88" font-size="13" font-weight="700" fill="#912018">Hepatitis B</text>
<text x="38" y="110" font-size="12" fill="#1f2933">Blood-borne virus; a vaccine</text>
<text x="38" y="126" font-size="12" fill="#1f2933">is recommended for this work</text>
<rect x="284" y="64" width="232" height="90" rx="10" fill="url(#gRed)" stroke="#b42318" stroke-width="1.5" filter="url(#sh)"/>
<text x="298" y="88" font-size="13" font-weight="700" fill="#912018">Hepatitis C</text>
<text x="298" y="110" font-size="12" fill="#1f2933">Blood-borne virus; no</text>
<text x="298" y="126" font-size="12" fill="#1f2933">post-exposure prophylaxis is</text>
<text x="298" y="142" font-size="12" fill="#1f2933">available</text>
<rect x="544" y="64" width="232" height="90" rx="10" fill="url(#gRed)" stroke="#b42318" stroke-width="1.5" filter="url(#sh)"/>
<text x="558" y="88" font-size="13" font-weight="700" fill="#912018">HIV</text>
<text x="558" y="110" font-size="12" fill="#1f2933">Blood-borne virus; PEP should</text>
<text x="558" y="126" font-size="12" fill="#1f2933">start within 72 hours if</text>
<text x="558" y="142" font-size="12" fill="#1f2933">recommended</text>
<rect x="24" y="186" width="752" height="74" rx="10" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="1.5" filter="url(#sh)"/>
<text x="38" y="210" font-size="13" font-weight="700" fill="#0b6e4f">Standard precautions: every job, every source</text>
<text x="38" y="232" font-size="12" fill="#1f2933">Treat all blood and body fluids as potentially infectious. You cannot tell by looking, and you never ask the</text>
<text x="38" y="248" font-size="12" fill="#1f2933">family.</text>
<line x1="140.0" y1="156" x2="140.0" y2="184" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="400.0" y1="156" x2="400.0" y2="184" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="660.0" y1="156" x2="660.0" y2="184" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="292" width="232" height="124" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="1.5" filter="url(#sh)"/>
<text x="38" y="316" font-size="13" font-weight="700" fill="#8f3806">Sharps injury</text>
<text x="38" y="338" font-size="12" fill="#1f2933">Needle, glass or fragment</text>
<text x="38" y="354" font-size="12" fill="#1f2933">breaks the skin. Barrier: look</text>
<text x="38" y="370" font-size="12" fill="#1f2933">before you touch, tongs, rigid</text>
<text x="38" y="386" font-size="12" fill="#1f2933">container.</text>
<rect x="284" y="292" width="232" height="124" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="1.5" filter="url(#sh)"/>
<text x="298" y="316" font-size="13" font-weight="700" fill="#8f3806">Splash to eyes, nose or</text>
<text x="298" y="334" font-size="13" font-weight="700" fill="#8f3806">mouth</text>
<text x="298" y="356" font-size="12" fill="#1f2933">Mucous membranes absorb fluid.</text>
<text x="298" y="372" font-size="12" fill="#1f2933">Barrier: eye protection or</text>
<text x="298" y="388" font-size="12" fill="#1f2933">face shield, and a respirator</text>
<text x="298" y="404" font-size="12" fill="#1f2933">for droplets.</text>
<rect x="544" y="292" width="232" height="124" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="1.5" filter="url(#sh)"/>
<text x="558" y="316" font-size="13" font-weight="700" fill="#8f3806">Contact with broken skin</text>
<text x="558" y="338" font-size="12" fill="#1f2933">Cuts, grazes or dermatitis let</text>
<text x="558" y="354" font-size="12" fill="#1f2933">fluid in. Barrier: waterproof</text>
<text x="558" y="370" font-size="12" fill="#1f2933">dressing, gloves, hand</text>
<text x="558" y="386" font-size="12" fill="#1f2933">hygiene.</text>
<line x1="140.0" y1="262" x2="140.0" y2="290" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="400.0" y1="262" x2="400.0" y2="290" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="660.0" y1="262" x2="660.0" y2="290" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="776" y="444" font-size="12" fill="#52606d" text-anchor="end">CARSI · Trauma &amp; Biohazard Decontamination Practitioner · schematic, not to scale</text>
</svg>

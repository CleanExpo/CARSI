<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Who does what at clearance</title>
<desc id="d">Three linked cards for the owner or insurer, the remediator and the independent hygienist, showing who contracts and briefs whom, who agrees the pass criteria and who verifies.</desc>
<rect width="800" height="500" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Who does what at clearance</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b6e4f"/></marker>
<marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b54708"/></marker>
<marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef3"/></linearGradient>
<linearGradient id="gWarn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#fde6c8"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3fbf7"/><stop offset="1" stop-color="#d3eee2"/></linearGradient>
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fc"/><stop offset="1" stop-color="#d6e5f2"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6f5"/><stop offset="1" stop-color="#f9d7d3"/></linearGradient>
<linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16875f"/><stop offset="1" stop-color="#0a5c42"/></linearGradient>
<radialGradient id="gDot" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#2fa77c"/><stop offset="1" stop-color="#0a5c42"/></radialGradient>
<radialGradient id="gDotW" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#e07a2c"/><stop offset="1" stop-color="#8f3806"/></radialGradient>
<radialGradient id="gDotB" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#4b8cc0"/><stop offset="1" stop-color="#174a6e"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dx="0" dy="3" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shS" x="-20%" y="-20%" width="150%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/><feOffset dx="1" dy="1.6" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="gSlabTopG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bfe3d3"/><stop offset="1" stop-color="#9fd2bc"/></linearGradient><linearGradient id="gSlabSideG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aa585"/><stop offset="1" stop-color="#2f7d5d"/></linearGradient><linearGradient id="gSlabTopW" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f9d9b0"/><stop offset="1" stop-color="#f2c48b"/></linearGradient><linearGradient id="gSlabSideW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d98a43"/><stop offset="1" stop-color="#a95b17"/></linearGradient><linearGradient id="gSlabTopB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfe0ef"/><stop offset="1" stop-color="#b3cde3"/></linearGradient><linearGradient id="gSlabSideB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8db5"/><stop offset="1" stop-color="#2d5f86"/></linearGradient><linearGradient id="gSlabTopC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e4e9ee"/><stop offset="1" stop-color="#d0d8df"/></linearGradient><linearGradient id="gSlabSideC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa5b1"/><stop offset="1" stop-color="#6b7785"/></linearGradient><linearGradient id="gSlabTopR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c9c3"/><stop offset="1" stop-color="#eeaaa1"/></linearGradient><linearGradient id="gSlabSideR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d0564a"/><stop offset="1" stop-color="#912018"/></linearGradient>
</defs>
<polygon points="286,74 298,65 532,65 520,74" fill="url(#gSlabTopB)" stroke="#52606d" stroke-width="1"/>
<polygon points="520,80 532,71 532,141 520,150" fill="url(#gSlabSideB)" stroke="#52606d" stroke-width="1"/>
<rect x="280" y="74" width="240" height="80" rx="8" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<text x="400" y="104" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Owner or insurer</text>
<text x="400" y="126" font-size="12" fill="#52606d" text-anchor="middle">decides and pays</text>
<polygon points="46,300 58,291 302,291 290,300" fill="url(#gSlabTopG)" stroke="#52606d" stroke-width="1"/>
<polygon points="290,306 302,297 302,373 290,382" fill="url(#gSlabSideG)" stroke="#52606d" stroke-width="1"/>
<rect x="40" y="300" width="250" height="86" rx="8" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="2" filter="url(#sh)"/>
<text x="165" y="330" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Remediator</text>
<text x="165" y="352" font-size="12" fill="#52606d" text-anchor="middle">does the work and</text>
<text x="165" y="368" font-size="12" fill="#52606d" text-anchor="middle">its own checks</text>
<polygon points="504,300 516,291 760,291 748,300" fill="url(#gSlabTopW)" stroke="#52606d" stroke-width="1"/>
<polygon points="748,306 760,297 760,373 748,382" fill="url(#gSlabSideW)" stroke="#52606d" stroke-width="1"/>
<rect x="498" y="300" width="250" height="86" rx="8" fill="url(#gWarn)" stroke="#b54708" stroke-width="2" filter="url(#sh)"/>
<text x="623" y="330" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Independent hygienist</text>
<text x="623" y="352" font-size="12" fill="#52606d" text-anchor="middle">assesses, sets and</text>
<text x="623" y="368" font-size="12" fill="#52606d" text-anchor="middle">confirms the clearance</text>
<line x1="300" y1="156" x2="190" y2="296" stroke="#0b6e4f" stroke-width="2" marker-end="url(#arrowG)"/>
<text x="96" y="220" font-size="12" font-weight="700" fill="#0b6e4f">contracts the</text>
<text x="96" y="236" font-size="12" font-weight="700" fill="#0b6e4f">work, in writing</text>
<line x1="486" y1="156" x2="586" y2="296" stroke="#b54708" stroke-width="2" marker-end="url(#arrowW)"/>
<line x1="612" y1="296" x2="512" y2="158" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrowB)"/>
<text x="612" y="206" font-size="12" font-weight="700" fill="#1f5f8b">clearance report</text>
<text x="452" y="254" font-size="12" font-weight="700" fill="#b54708">engages and</text>
<text x="452" y="270" font-size="12" font-weight="700" fill="#b54708">briefs</text>
<line x1="292" y1="343" x2="494" y2="343" stroke="#52606d" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="393" y="334" font-size="12" font-weight="700" fill="#1f2933" text-anchor="middle">pass criteria agreed</text>
<text x="393" y="362" font-size="12" fill="#52606d" text-anchor="middle">before work starts</text>
<rect x="24" y="408" width="752" height="66" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2"/>
<text x="40" y="432" font-size="12" fill="#1f2933">Brief in numbers: 60.5 + 60.5 + 38.4 = 159.4 m² of floor, × 2.7 m = 430 m³ of air in scope;</text>
<text x="40" y="450" font-size="12" fill="#1f2933">plasterboard at 38% WME against a 12% WME dry reference. Independence is disclosed in writing.</text>
<text x="776" y="488" font-size="11" fill="#52606d" text-anchor="end">CARSI · Level 3 Mould Remediation · schematic, not to scale</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Change control loop</title>
<desc id="d">A loop of seven steps: find, make safe, record, notify, agree in writing, update the plan and SWMS, then resume, with the work stopped at the make-safe step and the change in numbers beside it.</desc>
<rect width="800" height="540" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Change control loop</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>

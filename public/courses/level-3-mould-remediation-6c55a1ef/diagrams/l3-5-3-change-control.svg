<rect x="172" y="102" width="148" height="56" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="246" y="128" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Find</text>
<text x="246" y="150" font-size="12" fill="#52606d" text-anchor="middle">outside the scope</text>
<rect x="304.9" y="166" width="148" height="56" rx="10" fill="url(#gRed)" stroke="#b42318" stroke-width="2" filter="url(#sh)"/>
<text x="378.9" y="192" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Make safe</text>
<text x="378.9" y="214" font-size="12" fill="#52606d" text-anchor="middle">stop that part</text>
<rect x="337.7" y="309.8" width="148" height="56" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="411.7" y="335.8" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Record</text>
<text x="411.7" y="357.8" font-size="12" fill="#52606d" text-anchor="middle">photos, m, m²</text>
<rect x="245.8" y="425.2" width="148" height="56" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="319.8" y="451.2" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Notify</text>
<text x="319.8" y="473.2" font-size="12" fill="#52606d" text-anchor="middle">client, insurer, others</text>
<rect x="98.2" y="425.2" width="148" height="56" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="172.2" y="451.2" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Agree in writing</text>
<text x="172.2" y="473.2" font-size="12" fill="#52606d" text-anchor="middle">name, date</text>
<rect x="6.3" y="309.8" width="148" height="56" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="80.3" y="335.8" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Update plan, SWMS</text>
<text x="80.3" y="357.8" font-size="12" fill="#52606d" text-anchor="middle">crew briefed</text>
<rect x="39.1" y="166" width="148" height="56" rx="10" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="2" filter="url(#sh)"/>
<text x="113.1" y="192" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Resume</text>
<text x="113.1" y="214" font-size="12" fill="#52606d" text-anchor="middle">on the new scope</text>
<circle cx="430.9" cy="186" r="14" fill="url(#gDotW)" stroke="#ffffff" stroke-width="1.5"/>
<text x="430.9" y="189" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">STOP</text>
<circle cx="246" cy="300" r="58" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<text x="246" y="298" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Scope grows</text>
<text x="246" y="316" font-size="12" fill="#52606d" text-anchor="middle">run the loop</text>
<rect x="500" y="92" width="276" height="104" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="514" y="118" font-size="14" font-weight="700" fill="#1f2933">Quoted</text>
<text x="514" y="140" font-size="12" fill="#52606d">18 m² of wall</text>
<text x="514" y="156" font-size="12" fill="#52606d">4.0 × 3.0 × 2.7 = 32.4 m³</text>
<text x="514" y="172" font-size="12" fill="#52606d">× 6 = 194 m³/h: 1 scrubber</text>
<rect x="500" y="212" width="276" height="104" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="2" filter="url(#sh)"/>
<text x="514" y="238" font-size="14" font-weight="700" fill="#1f2933">Found</text>
<text x="514" y="260" font-size="12" fill="#52606d">café wall, shared wall, 2 m in</text>
<text x="514" y="276" font-size="12" fill="#52606d">11.0 × 3.0 × 2.7 = 89.1 m³</text>
<text x="514" y="292" font-size="12" fill="#52606d">× 6 = 535 m³/h: 3 scrubbers</text>
<rect x="500" y="332" width="276" height="86" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="514" y="358" font-size="14" font-weight="700" fill="#1f2933">Extra removal</text>
<text x="514" y="380" font-size="12" fill="#52606d">9 m × 1.2 m × 2 faces</text>
<text x="514" y="396" font-size="12" fill="#52606d">= 21.6 m² more</text>
<rect x="500" y="434" width="276" height="70" rx="10" fill="url(#gRed)" stroke="#b42318" stroke-width="2" filter="url(#sh)"/>
<text x="514" y="460" font-size="14" font-weight="700" fill="#1f2933">No approval in writing</text>
<text x="514" y="482" font-size="12" fill="#52606d">no work on the new scope</text>
<text x="776" y="528" font-size="11" fill="#52606d" text-anchor="end">CARSI · Level 3 Mould Remediation · schematic, not to scale</text>
</svg>

<title id="t">Condensation at a cold ceiling corner</title>
<desc id="d">A shaded section through a ceiling and external wall corner showing warm moist room air, a temperature gradient through the wall, a gap in the ceiling insulation and condensation forming where the surface is colder than the dew point.</desc>

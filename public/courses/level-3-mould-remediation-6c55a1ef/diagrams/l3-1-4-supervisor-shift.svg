<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The supervisor’s shift</title>
<desc id="d">A shift cycle for the supervisor: pre-start, entry log, work rotation with cool rest breaks, hold-point checks and close-out, with heat warning signs and a 10-hour rotation bar beside it.</desc>
<rect width="800" height="520" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">The supervisor’s shift</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>

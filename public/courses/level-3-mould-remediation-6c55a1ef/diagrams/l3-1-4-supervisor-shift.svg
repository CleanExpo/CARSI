<text x="244" y="142" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Pre-start</text>
<text x="244" y="164" font-size="12" fill="#52606d" text-anchor="middle">10 min at the site plan</text>
<rect x="304.7" y="219.6" width="164" height="60" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="386.7" y="245.6" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Entry log</text>
<text x="386.7" y="267.6" font-size="12" fill="#52606d" text-anchor="middle">who, when, respirator</text>
<rect x="250.2" y="387.4" width="164" height="60" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="2" filter="url(#sh)"/>
<text x="332.2" y="413.4" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Work rotation</text>
<text x="332.2" y="435.4" font-size="12" fill="#52606d" text-anchor="middle">45 min work, 15 rest</text>
<rect x="73.8" y="387.4" width="164" height="60" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="155.8" y="413.4" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Hold-point checks</text>
<text x="155.8" y="435.4" font-size="12" fill="#52606d" text-anchor="middle">torch and cloth wipe</text>
<rect x="19.3" y="219.6" width="164" height="60" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="101.3" y="245.6" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Close-out</text>
<text x="101.3" y="267.6" font-size="12" fill="#52606d" text-anchor="middle">secure, download, plan</text>
<circle cx="244" cy="296" r="52" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<text x="244" y="292" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">One shift</text>
<text x="244" y="310" font-size="12" fill="#52606d" text-anchor="middle">every shift</text>
<rect x="486" y="80" width="290" height="128" rx="10" fill="url(#gRed)" stroke="#b42318" stroke-width="2" filter="url(#sh)"/>
<circle cx="506" cy="100" r="12" fill="url(#gDotW)"/>
<text x="506" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
<text x="528" y="106" font-size="14" font-weight="700" fill="#1f2933">Heat warning signs</text>
<text x="528" y="130" font-size="12" fill="#52606d">Dizziness, confusion, headache,</text>
<text x="528" y="148" font-size="12" fill="#52606d">nausea, sweating that stops.</text>
<text x="528" y="166" font-size="12" fill="#52606d">Leave the zone, cool down, first</text>
<text x="528" y="184" font-size="12" fill="#52606d">aid. Confusion is an emergency.</text>
<text x="486" y="262" font-size="13" font-weight="700" fill="#1f2933">A 10-hour shift with rotation</text>

<text x="631" y="320" font-size="11" fill="#52606d" text-anchor="middle">5 h</text>
<text x="776" y="320" font-size="11" fill="#52606d" text-anchor="middle">10 h</text>
<rect x="486" y="336" width="14" height="12" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="1"/>
<text x="506" y="346" font-size="12" fill="#52606d">45 min work</text>
<rect x="606" y="336" width="14" height="12" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="1"/>
<text x="626" y="346" font-size="12" fill="#52606d">15 min cool rest</text>
<rect x="486" y="368" width="290" height="92" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="500" y="394" font-size="14" font-weight="700" fill="#1f2933">Plan on hands-on time</text>
<text x="500" y="416" font-size="12" fill="#52606d">10 × 45 min = 450 min = 7.5 h</text>
<text x="500" y="432" font-size="12" fill="#52606d">per person, not 10 h. Fit test in</text>
<text x="500" y="448" font-size="12" fill="#52606d">date for the respirator worn.</text>
<text x="776" y="508" font-size="11" fill="#52606d" text-anchor="end">CARSI · Level 3 Mould Remediation · schematic, not to scale</text>

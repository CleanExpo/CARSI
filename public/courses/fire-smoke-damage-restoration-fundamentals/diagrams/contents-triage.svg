<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 364" width="800" height="364" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Contents triage and the HVAC check</title>
<desc id="d">Photograph and inventory first; triage contents into restore on site, restore off site and total loss; check HVAC outlets, filters, coil and ductwork, and keep the system off until it is cleaned.</desc>
<rect width="800" height="364" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Contents triage and the HVAC check</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect x="24" y="64" width="752" height="64" rx="10" fill="#eef4fa" stroke="#1f5f8b" stroke-width="2"/><text x="38" y="91" font-size="14" font-weight="700" fill="#1f2933">Photograph and inventory every item first</text><text x="38" y="113" font-size="12" fill="#3e4c59">Item, room and group, before anything is moved or cleaned.</text><rect x="24" y="148" width="237" height="80" rx="10" fill="#eef8f3" stroke="#0b6e4f" stroke-width="2"/><text x="38" y="175" font-size="14" font-weight="700" fill="#1f2933">Restore on site</text><text x="38" y="197" font-size="12" fill="#3e4c59">light residue on a</text><text x="38" y="213" font-size="12" fill="#3e4c59">durable surface</text><rect x="281" y="148" width="237" height="80" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><text x="295" y="175" font-size="14" font-weight="700" fill="#1f2933">Restore off site</text><text x="295" y="197" font-size="12" fill="#3e4c59">textiles, art, documents,</text><text x="295" y="213" font-size="12" fill="#3e4c59">electronics: specialist</text><rect x="538" y="148" width="237" height="80" rx="10" fill="#fdecea" stroke="#b42318" stroke-width="2"/><text x="552" y="175" font-size="14" font-weight="700" fill="#1f2933">Total loss</text><text x="552" y="197" font-size="12" fill="#3e4c59">too damaged, porous or</text><text x="552" y="213" font-size="12" fill="#3e4c59">contaminated to restore</text><rect x="24" y="248" width="173" height="80" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><text x="38" y="275" font-size="14" font-weight="700" fill="#1f2933">Outlets</text><text x="38" y="297" font-size="12" fill="#3e4c59">soot around</text><text x="38" y="313" font-size="12" fill="#3e4c59">and inside</text><rect x="217" y="248" width="173" height="80" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><text x="231" y="275" font-size="14" font-weight="700" fill="#1f2933">Filters</text><text x="231" y="297" font-size="12" fill="#3e4c59">photograph</text><text x="231" y="313" font-size="12" fill="#3e4c59">before removal</text><rect x="410" y="248" width="173" height="80" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><text x="424" y="275" font-size="14" font-weight="700" fill="#1f2933">Coil and ducts</text><text x="424" y="297" font-size="12" fill="#3e4c59">inside the</text><text x="424" y="313" font-size="12" fill="#3e4c59">ductwork too</text><rect x="603" y="248" width="173" height="80" rx="10" fill="#fff4e5" stroke="#b54708" stroke-width="2"/><text x="617" y="275" font-size="14" font-weight="700" fill="#1f2933">Keep it off</text><text x="617" y="297" font-size="12" fill="#3e4c59">until cleaned</text><text x="617" y="313" font-size="12" fill="#3e4c59">and filters new</text>
<text x="776" y="352" font-size="11" fill="#52606d" text-anchor="end">CARSI · Fire &amp; Smoke Restoration Practitioner · schematic, not to scale</text>
</svg>

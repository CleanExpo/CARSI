<text x="104" y="126" font-size="13" fill="#52606d" text-anchor="middle">0 Pa</text>
<line x1="196" y1="120" x2="210" y2="128" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrowB)"/>

</defs>
<polygon points="30,74 42,65 196,65 184,74" fill="url(#gSlabTopC)" stroke="#52606d" stroke-width="1"/>
<polygon points="184,80 196,71 196,137 184,146" fill="url(#gSlabSideC)" stroke="#52606d" stroke-width="1"/>

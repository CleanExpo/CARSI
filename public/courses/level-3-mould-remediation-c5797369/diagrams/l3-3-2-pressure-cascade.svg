<text x="62" y="294" font-size="11" fill="#52606d" text-anchor="end">0</text>
<text x="62" y="350.7" font-size="11" fill="#52606d" text-anchor="end">−4</text>
<text x="62" y="407.3" font-size="11" fill="#52606d" text-anchor="end">−8</text>
<text x="62" y="464" font-size="11" fill="#52606d" text-anchor="end">−12</text>
<text x="70" y="478" font-size="11" fill="#52606d" text-anchor="middle">12:00</text>
<text x="242.7" y="478" font-size="11" fill="#52606d" text-anchor="middle">14:00</text>
<text x="415.3" y="478" font-size="11" fill="#52606d" text-anchor="middle">16:00</text>
<text x="588" y="478" font-size="11" fill="#52606d" text-anchor="middle">18:00</text>
<text x="70" y="280" font-size="12" font-weight="700" fill="#1f2933">Zone 2 logger, Pa, a reading every 5 minutes</text>
<text x="596" y="364.8" font-size="11" font-weight="700" fill="#b42318">limit −5</text>
<text x="296.2" y="498" font-size="12" font-weight="700" fill="#b42318">8 readings above −5 Pa = 40 minutes: fire door propped open</text>
<rect x="650" y="290" width="126" height="170" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2"/>
<text x="662" y="314" font-size="12" fill="#1f2933">288 a day</text>
<text x="662" y="333" font-size="12" fill="#1f2933">× 12 days</text>
<text x="662" y="352" font-size="12" fill="#1f2933">= 3,456 per</text>
<text x="662" y="371" font-size="12" fill="#1f2933">zone. 99.8% in</text>
<text x="662" y="390" font-size="12" fill="#1f2933">limit does not</text>
<text x="662" y="409" font-size="12" fill="#1f2933">excuse the</text>
<text x="662" y="428" font-size="12" fill="#1f2933">40 minutes.</text>
<text x="776" y="528" font-size="11" fill="#52606d" text-anchor="end">CARSI · Level 3 Mould Remediation · schematic, not to scale</text>
</svg>

<text x="290" y="122" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Clean room</text>
<text x="290" y="144" font-size="13" fill="#52606d" text-anchor="middle">a little below</text>
<line x1="382" y1="138" x2="396" y2="146" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrowB)"/>
<polygon points="402,110 414,101 568,101 556,110" fill="url(#gSlabTopW)" stroke="#52606d" stroke-width="1"/>
<polygon points="556,116 568,107 568,173 556,182" fill="url(#gSlabSideW)" stroke="#52606d" stroke-width="1"/>
<rect x="396" y="110" width="160" height="76" rx="8" fill="url(#gWarn)" stroke="#b54708" stroke-width="2" filter="url(#sh)"/>
<text x="476" y="140" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Dirty room</text>
<text x="476" y="162" font-size="13" fill="#52606d" text-anchor="middle">lower again</text>
<line x1="568" y1="156" x2="582" y2="164" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrowB)"/>
<polygon points="588,128 600,119 754,119 742,128" fill="url(#gSlabTopR)" stroke="#52606d" stroke-width="1"/>
<polygon points="742,134 754,125 754,191 742,200" fill="url(#gSlabSideR)" stroke="#52606d" stroke-width="1"/>
<rect x="582" y="128" width="160" height="76" rx="8" fill="url(#gRed)" stroke="#b42318" stroke-width="2" filter="url(#sh)"/>
<text x="662" y="158" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Work zone</text>
<text x="662" y="180" font-size="13" fill="#52606d" text-anchor="middle">about −8 Pa</text>
<text x="24" y="236" font-size="13" font-weight="700" fill="#1f2933">Air moves from clean to dirty, one step at a time.</text>
<rect x="70" y="290" width="518" height="170" fill="#fbfcfd" stroke="#9aa5b1" stroke-width="1"/>
<rect x="300.2" y="291" width="57.6" height="168" fill="#f9d7d3" fill-opacity="0.7"/>
<line x1="70" y1="360.8" x2="588" y2="360.8" stroke="#b42318" stroke-width="1.5" stroke-dasharray="6 4"/>

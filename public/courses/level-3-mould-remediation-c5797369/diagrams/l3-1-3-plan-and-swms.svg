<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The work plan and the SWMS</title>
<desc id="d">Two shaded stacked slabs: the remediation work plan on top listing what will be done, and the SWMS beneath listing how high risk construction work is done safely, linked by arrows at each high-risk step.</desc>
<rect width="800" height="480" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">The work plan and the SWMS</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b6e4f"/></marker>
<marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b54708"/></marker>
<marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef3"/></linearGradient>
<linearGradient id="gWarn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#fde6c8"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3fbf7"/><stop offset="1" stop-color="#d3eee2"/></linearGradient>
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fc"/><stop offset="1" stop-color="#d6e5f2"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6f5"/><stop offset="1" stop-color="#f9d7d3"/></linearGradient>
<linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16875f"/><stop offset="1" stop-color="#0a5c42"/></linearGradient>
<radialGradient id="gDot" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#2fa77c"/><stop offset="1" stop-color="#0a5c42"/></radialGradient>
<radialGradient id="gDotW" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#e07a2c"/><stop offset="1" stop-color="#8f3806"/></radialGradient>
<radialGradient id="gDotB" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#4b8cc0"/><stop offset="1" stop-color="#174a6e"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dx="0" dy="3" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shS" x="-20%" y="-20%" width="150%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/><feOffset dx="1" dy="1.6" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="gSlabTopG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bfe3d3"/><stop offset="1" stop-color="#9fd2bc"/></linearGradient><linearGradient id="gSlabSideG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aa585"/><stop offset="1" stop-color="#2f7d5d"/></linearGradient><linearGradient id="gSlabTopW" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f9d9b0"/><stop offset="1" stop-color="#f2c48b"/></linearGradient><linearGradient id="gSlabSideW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d98a43"/><stop offset="1" stop-color="#a95b17"/></linearGradient><linearGradient id="gSlabTopB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfe0ef"/><stop offset="1" stop-color="#b3cde3"/></linearGradient><linearGradient id="gSlabSideB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8db5"/><stop offset="1" stop-color="#2d5f86"/></linearGradient><linearGradient id="gSlabTopC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e4e9ee"/><stop offset="1" stop-color="#d0d8df"/></linearGradient><linearGradient id="gSlabSideC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa5b1"/><stop offset="1" stop-color="#6b7785"/></linearGradient><linearGradient id="gSlabTopR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c9c3"/><stop offset="1" stop-color="#eeaaa1"/></linearGradient><linearGradient id="gSlabSideR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d0564a"/><stop offset="1" stop-color="#912018"/></linearGradient>
</defs>
<polygon points="46,70 58,61 692,61 680,70" fill="url(#gSlabTopG)" stroke="#52606d" stroke-width="1"/>
<polygon points="680,76 692,67 692,207 680,216" fill="url(#gSlabSideG)" stroke="#52606d" stroke-width="1"/>
<rect x="40" y="70" width="640" height="150" rx="8" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="2" filter="url(#sh)"/>
<text x="58" y="98" font-size="15" font-weight="700" fill="#1f2933">Remediation work plan: what will be done</text>
<rect x="58" y="118" width="94" height="58" rx="8" fill="#ffffff" stroke="#0b6e4f" stroke-width="1.5" filter="url(#shS)"/>
<text x="105" y="142" font-size="12" font-weight="700" fill="#1f2933" text-anchor="middle">Areas and</text>
<text x="105" y="160" font-size="12" fill="#52606d" text-anchor="middle">Conditions</text>
<rect x="162" y="118" width="94" height="58" rx="8" fill="#ffffff" stroke="#0b6e4f" stroke-width="1.5" filter="url(#shS)"/>
<text x="209" y="142" font-size="12" font-weight="700" fill="#1f2933" text-anchor="middle">Access</text>
<text x="209" y="160" font-size="12" fill="#52606d" text-anchor="middle">and zones</text>
<rect x="266" y="118" width="94" height="58" rx="8" fill="#ffffff" stroke="#0b6e4f" stroke-width="1.5" filter="url(#shS)"/>
<text x="313" y="142" font-size="12" font-weight="700" fill="#1f2933" text-anchor="middle">Hazmat</text>
<text x="313" y="160" font-size="12" fill="#52606d" text-anchor="middle">hold points</text>
<rect x="370" y="118" width="94" height="58" rx="8" fill="#ffffff" stroke="#0b6e4f" stroke-width="1.5" filter="url(#shS)"/>
<text x="417" y="142" font-size="12" font-weight="700" fill="#1f2933" text-anchor="middle">Removal and</text>
<text x="417" y="160" font-size="12" fill="#52606d" text-anchor="middle">cleaning</text>
<rect x="474" y="118" width="94" height="58" rx="8" fill="#ffffff" stroke="#0b6e4f" stroke-width="1.5" filter="url(#shS)"/>
<text x="521" y="142" font-size="12" font-weight="700" fill="#1f2933" text-anchor="middle">Drying</text>
<text x="521" y="160" font-size="12" fill="#52606d" text-anchor="middle">goals</text>
<rect x="578" y="118" width="94" height="58" rx="8" fill="#ffffff" stroke="#0b6e4f" stroke-width="1.5" filter="url(#shS)"/>
<text x="625" y="142" font-size="12" font-weight="700" fill="#1f2933" text-anchor="middle">Checks, waste,</text>
<text x="625" y="160" font-size="12" fill="#52606d" text-anchor="middle">handover</text>
<text x="58" y="202" font-size="12" fill="#52606d">In work order, from the first area to handover.</text>
<polygon points="46,304 58,295 692,295 680,304" fill="url(#gSlabTopW)" stroke="#52606d" stroke-width="1"/>
<polygon points="680,310 692,301 692,431 680,440" fill="url(#gSlabSideW)" stroke="#52606d" stroke-width="1"/>
<rect x="40" y="304" width="640" height="140" rx="8" fill="url(#gWarn)" stroke="#b54708" stroke-width="2" filter="url(#sh)"/>
<text x="58" y="332" font-size="15" font-weight="700" fill="#1f2933">SWMS: how the high-risk parts are done safely</text>
<rect x="58" y="350" width="94" height="58" rx="8" fill="#ffffff" stroke="#b54708" stroke-width="1.5" filter="url(#shS)"/>
<text x="105" y="374" font-size="12" font-weight="700" fill="#1f2933" text-anchor="middle">Powered</text>
<text x="105" y="392" font-size="12" fill="#52606d" text-anchor="middle">mobile plant</text>
<rect x="162" y="350" width="94" height="58" rx="8" fill="#ffffff" stroke="#b54708" stroke-width="1.5" filter="url(#shS)"/>
<text x="209" y="374" font-size="12" font-weight="700" fill="#1f2933" text-anchor="middle">Falls over</text>
<text x="209" y="392" font-size="12" fill="#52606d" text-anchor="middle">2 metres</text>
<rect x="266" y="350" width="94" height="58" rx="8" fill="#ffffff" stroke="#b54708" stroke-width="1.5" filter="url(#shS)"/>
<text x="313" y="374" font-size="12" font-weight="700" fill="#1f2933" text-anchor="middle">Disturbing</text>
<text x="313" y="392" font-size="12" fill="#52606d" text-anchor="middle">asbestos</text>
<rect x="370" y="350" width="94" height="58" rx="8" fill="#ffffff" stroke="#b54708" stroke-width="1.5" filter="url(#shS)"/>
<text x="417" y="374" font-size="12" font-weight="700" fill="#1f2933" text-anchor="middle">Temporary</text>
<text x="417" y="392" font-size="12" fill="#52606d" text-anchor="middle">support</text>
<text x="486" y="368" font-size="12" fill="#52606d">Run the pre-start from it.</text>
<text x="486" y="386" font-size="12" fill="#52606d">Stop if it is not followed.</text>
<text x="486" y="404" font-size="12" fill="#52606d">Review when the job changes.</text>
<line x1="196" y1="222" x2="110" y2="300" stroke="#b54708" stroke-width="2" marker-end="url(#arrowW)"/>
<line x1="214" y1="222" x2="214" y2="300" stroke="#b54708" stroke-width="2" marker-end="url(#arrowW)"/>
<line x1="318" y1="222" x2="318" y2="300" stroke="#b54708" stroke-width="2" marker-end="url(#arrowW)"/>
<line x1="422" y1="222" x2="422" y2="300" stroke="#b54708" stroke-width="2" marker-end="url(#arrowW)"/>
<text x="40" y="262" font-size="12" fill="#b54708">office EWP</text>
<text x="222" y="256" font-size="12" fill="#b54708">6.5 m</text>
<text x="222" y="272" font-size="12" fill="#b54708">stairwell</text>
<text x="326" y="264" font-size="12" fill="#b54708">1974 building</text>
<text x="430" y="264" font-size="12" fill="#b54708">rotten bearer</text>
<rect x="560" y="232" width="216" height="56" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2"/>
<text x="576" y="254" font-size="12" fill="#1f2933">Each high-risk step in the plan</text>
<text x="576" y="271" font-size="12" fill="#1f2933">needs its SWMS controls.</text>
<text x="776" y="468" font-size="11" fill="#52606d" text-anchor="end">CARSI · Level 3 Mould Remediation · schematic, not to scale</text>
</svg>

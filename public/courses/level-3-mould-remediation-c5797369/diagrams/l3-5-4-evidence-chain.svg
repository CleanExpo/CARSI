<text x="440" y="302" font-size="12" fill="#52606d" text-anchor="middle">3 March</text>
<rect x="234" y="288" width="22" height="12" rx="6" fill="none" stroke="#b42318" stroke-width="2.5"/>
<rect x="306" y="288" width="22" height="12" rx="6" fill="none" stroke="#b42318" stroke-width="2.5"/>
<path d="M268,282 L276,294 L268,306" stroke="#b42318" stroke-width="2" fill="none"/>
<path d="M294,282 L286,294 L294,306" stroke="#b42318" stroke-width="2" fill="none"/>
<text x="281" y="330" font-size="12" font-weight="700" fill="#b42318" text-anchor="middle">48 days</text>
<rect x="570" y="244" width="206" height="100" rx="10" fill="url(#gRed)" stroke="#b42318" stroke-width="2" filter="url(#sh)"/>
<text x="584" y="270" font-size="14" font-weight="700" fill="#1f2933">In the report</text>
<text x="584" y="292" font-size="12" fill="#52606d">how long it was wet</text>
<text x="584" y="308" font-size="12" fill="#52606d">before 3 March is</text>
<text x="584" y="324" font-size="12" fill="#52606d">not known</text>
<rect x="24" y="376" width="752" height="106" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2"/>
<text x="40" y="402" font-size="12" fill="#1f2933">17 days (rest of January) + 28 (February) + 3 = 48 days before anyone measured.</text>
<text x="40" y="422" font-size="12" fill="#1f2933">Fact: point 7 read 41% WME on 3 March against a 12% WME dry reference.</text>
<text x="40" y="442" font-size="12" fill="#1f2933">Opinion, with reasons: the wet 6.8 m² of ceiling sits directly below the split balcony membrane.</text>
<text x="40" y="462" font-size="12" fill="#1f2933">Expect the report to be shared: insurers, strata managers, owners and tribunals may all read it.</text>
<text x="776" y="508" font-size="11" fill="#52606d" text-anchor="end">CARSI · Level 3 Mould Remediation · schematic, not to scale</text>

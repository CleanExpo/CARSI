<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The evidence chain</title>
<desc id="d">A chain of six linked cards from observation to measurement, photo, log, finding and report, with a broken link marked where a reading was not recorded for 48 days.</desc>
<rect width="800" height="520" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">The evidence chain</text>

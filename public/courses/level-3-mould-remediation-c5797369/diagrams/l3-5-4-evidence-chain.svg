<text x="124" y="302" font-size="12" fill="#52606d" text-anchor="middle">smell, 14 January</text>
<polygon points="346,252 354,245 548,245 540,252" fill="url(#gSlabTopG)" stroke="#52606d" stroke-width="1"/>
<polygon points="540,258 548,251 548,325 540,332" fill="url(#gSlabSideG)" stroke="#52606d" stroke-width="1"/>

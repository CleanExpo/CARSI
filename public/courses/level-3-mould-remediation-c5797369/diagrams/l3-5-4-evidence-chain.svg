<text x="720" y="140" font-size="11" fill="#52606d" text-anchor="middle">plain English,</text>
<text x="720" y="155" font-size="11" fill="#52606d" text-anchor="middle">opinion marked</text>
<text x="24" y="76" font-size="13" font-weight="700" fill="#1f2933">Every finding links back to a record</text>
<text x="24" y="236" font-size="13" font-weight="700" fill="#1f2933">A link that is missing is stated, not filled in</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Concrete: surface reading or hygrometer test</title>
<desc id="d">Slab cross-section in millimetres. A surface meter sees only the top few millimetres and gives a qualitative reading that condensation can raise. An in-situ relative humidity probe sits at depth, at 40 percent of the slab thickness, 80 millimetres in a 200 millimetre slab drying from the top.</desc>
<rect width="800" height="520" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Concrete: surface reading or hygrometer test</text>
<image x="745" y="14" width="31" height="31" href="data:image/png;base64,"/>
<rect x="80" y="200" width="610" height="140" fill="#d9dee3" stroke="#52606d" stroke-width="1.5"/><rect x="150" y="200" width="180" height="12" fill="#f6c28b" stroke="#d97706" stroke-width="1"/><rect x="170" y="140" width="140" height="40" rx="6" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/><text x="240" y="165" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700">Surface meter</text><line x1="240" y1="180" x2="240" y2="200" stroke="#52606d" stroke-width="1.5"/><text x="240" y="236" font-size="12" fill="#1f2933" text-anchor="middle">Sees the top few mm only</text><text x="240" y="254" font-size="12" fill="#1f2933" text-anchor="middle">Qualitative, in points</text><text x="240" y="272" font-size="12" fill="#b42318" text-anchor="middle">Condensation can raise it</text><rect x="513" y="200" width="14" height="56" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/><rect x="508" y="164" width="24" height="36" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/><text x="542" y="184" font-size="12" fill="#1f2933">Probe sleeve and cap</text><circle cx="520" cy="251" r="4" fill="#1d4ed8"/><line x1="480" y1="200" x2="480" y2="256" stroke="#52606d" stroke-width="1.5"/><line x1="474" y1="200" x2="486" y2="200" stroke="#52606d" stroke-width="1.5"/><line x1="474" y1="256" x2="486" y2="256" stroke="#52606d" stroke-width="1.5"/><text x="468" y="224" font-size="12" fill="#1f2933" text-anchor="end">80 mm</text><text x="468" y="240" font-size="12" fill="#1f2933" text-anchor="end">(40%)</text><text x="540" y="234" font-size="12" fill="#1f2933">RH probe at depth</text><text x="540" y="252" font-size="12" fill="#1f2933">Gives % RH</text><line x1="714" y1="200" x2="714" y2="340" stroke="#52606d" stroke-width="1.5"/><line x1="708" y1="200" x2="720" y2="200" stroke="#52606d" stroke-width="1.5"/><line x1="708" y1="340" x2="720" y2="340" stroke="#52606d" stroke-width="1.5"/><text x="728" y="266" font-size="12" fill="#1f2933">200 mm</text><text x="728" y="282" font-size="12" fill="#1f2933">slab</text><text x="400" y="364" font-size="12" fill="#3e4c59" text-anchor="middle">Example: 200 mm slab on the ground, drying from the top only (ARFA TB001)</text><rect x="24" y="388" width="368" height="96" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/><text x="36" y="410" font-size="14" font-weight="700" fill="#1f2933">Surface reading: points the way</text><text x="36" y="430" font-size="12.5" fill="#3e4c59" font-weight="400">Qualitative. Check the slab temperature against the room</text>
<text x="36" y="447.5" font-size="12.5" fill="#3e4c59" font-weight="400">dew point first. Cannot clear a slab.</text><rect x="408" y="388" width="368" height="96" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="420" y="410" font-size="14" font-weight="700" fill="#1f2933">Hygrometer test: decides</text><text x="420" y="430" font-size="12.5" fill="#3e4c59" font-weight="400">In situ probe to the named method. The floor covering</text>
<text x="420" y="447.5" font-size="12.5" fill="#3e4c59" font-weight="400">maker and the current standard set the limit.</text>
<text x="24" y="506" font-size="11" fill="#3e4c59">CARSI · Professional Moisture Meters · schematic, not to scale</text>

<text x="570" y="162" font-size="13" fill="#1f2933">Lines where cables and</text>
<text x="570" y="180" font-size="13" fill="#1f2933">pipes usually run: keep</text>
<text x="570" y="198" font-size="13" fill="#1f2933">pins off these</text>

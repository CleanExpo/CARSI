<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Where the first pin point may go</title>
<desc id="d">A wall elevation with a double GPO. Dashed zones run vertically and horizontally from the GPO where cables and pipes usually run. A pinless scan area lies to the left, and a pin point sits 300 mm to the side of the GPO, off both zones.</desc>

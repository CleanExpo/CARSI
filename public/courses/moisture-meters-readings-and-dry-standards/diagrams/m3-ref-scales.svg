<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How to word a reading</title>
<desc id="d">A flow chart. If the meter is calibrated for the material and the reading is within about 6 to 30 percent, write percent moisture content. Otherwise write points with a baseline, or above 30 percent qualitative.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect width="800" height="460" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">How to word a reading</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<rect x="250" y="60" width="300" height="40" fill="#f0f4f8" stroke="#52606d" stroke-width="1.5"/>
<text x="400.0" y="84" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">New reading to report</text>
<path d="M400,100 L400,136" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="250" y="136" width="300" height="44" fill="#e6f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="160" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Calibrated for this material?</text>
<path d="M550,158 L584,158" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="560" y="150" font-size="13" font-weight="700" fill="#b42318">No</text>
<rect x="584" y="120" width="192" height="78" fill="#fdf0e6" stroke="#b45309" stroke-width="1.5"/>
<text x="594" y="144" font-size="13" fill="#1f2933">Write points plus</text>
<text x="594" y="165" font-size="13" fill="#1f2933">the same-material</text>
<text x="594" y="186" font-size="13" fill="#1f2933">unaffected baseline</text>
<path d="M400,180 L400,232" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="408" y="210" font-size="13" font-weight="700" fill="#2f6b34">Yes</text>
<rect x="250" y="232" width="300" height="44" fill="#e6f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="256" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Within about 6% to 30%?</text>
<path d="M550,254 L584,254" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="560" y="246" font-size="13" font-weight="700" fill="#b42318">No</text>
<rect x="584" y="216" width="192" height="78" fill="#fdf0e6" stroke="#b45309" stroke-width="1.5"/>
<text x="594" y="240" font-size="13" fill="#1f2933">Above 30%: write</text>
<text x="594" y="261" font-size="13" fill="#1f2933">"above 30%</text>
<text x="594" y="282" font-size="13" fill="#1f2933">(qualitative)"</text>
<path d="M400,276 L400,328" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="408" y="306" font-size="13" font-weight="700" fill="#2f6b34">Yes</text>
<rect x="250" y="328" width="300" height="44" fill="#e3f9e5" stroke="#2f6b34" stroke-width="1.5"/>
<text x="400.0" y="352" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Write % MC, corrected</text>
<text x="24" y="412" font-size="13" fill="#3e4c59">No decimals on a qualitative reading. Add read height (mm) and pin depth (mm).</text>
<text x="24" y="444" font-size="11" fill="#616e7c">CARSI · Professional Moisture Meters · schematic, not to scale</text>
</svg>

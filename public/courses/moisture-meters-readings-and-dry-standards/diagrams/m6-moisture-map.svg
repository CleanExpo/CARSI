<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A moisture map: fixed points, trended over days</title>
<desc id="d">Left: a room plan with a wet area containing fixed points P1 and P2 on timber studs at 300 millimetres and P3 on laundry wall plasterboard at 400 millimetres, plus an unaffected control stud outside the wet area, read in the same order each visit. Right: two trend charts. Timber in percent moisture content over days 1, 3 and 5: P1 falls 24.2, 19.8, 16.3; P2 falls 17.2, 16.1, 15.1; the control stays 11.7, 11.8, 11.6; the goal is 14 percent or less. Plasterboard P3 in points: 61, 32, 18 against a goal of 13 to 15 points.</desc>

<text x="513.3" y="288" font-size="13" fill="#1f2933" text-anchor="middle">40%</text>
<path d="M626.7,262 L626.7,270" stroke="#52606d" stroke-width="2" fill="none"/>
<text x="626.7" y="288" font-size="13" fill="#1f2933" text-anchor="middle">50%</text>

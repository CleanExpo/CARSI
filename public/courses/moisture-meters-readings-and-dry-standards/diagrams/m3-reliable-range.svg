<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Reliable range on timber: about 6% to 30%</title>
<desc id="d">A horizontal scale from 0 to 60 percent. Resistance meters are reliable from about 6 to 30 percent, dielectric from about 4 to 30 percent. Above 30 percent readings are qualitative only.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect width="800" height="400" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Reliable range on timber: about 6% to 30%</text>

<text x="60.0" y="288" font-size="13" fill="#1f2933" text-anchor="middle">0%</text>
<path d="M173.3,262 L173.3,270" stroke="#52606d" stroke-width="2" fill="none"/>
<text x="173.3" y="288" font-size="13" fill="#1f2933" text-anchor="middle">10%</text>
<path d="M286.7,262 L286.7,270" stroke="#52606d" stroke-width="2" fill="none"/>
<text x="286.7" y="288" font-size="13" fill="#1f2933" text-anchor="middle">20%</text>
<path d="M400.0,262 L400.0,270" stroke="#52606d" stroke-width="2" fill="none"/>

<rect x="400.0" y="120" width="340.0" height="120" fill="#fde8e6" stroke="#b42318" stroke-width="1.5"/>
<text x="570.0" y="170" font-size="15" font-weight="700" fill="#b42318" text-anchor="middle">Above 30%:</text>
<text x="570.0" y="192" font-size="13" fill="#1f2933" text-anchor="middle">qualitative only</text>

<text x="740.0" y="288" font-size="13" fill="#1f2933" text-anchor="middle">60%</text>
<text x="24" y="326" font-size="13" fill="#3e4c59">Fibre saturation point of wood averages about 30% moisture content.</text>
<text x="24" y="348" font-size="13" fill="#3e4c59">Day 1 flood: studs 38%, 45%, &gt;60% are written "above 30% (qualitative)".</text>
<text x="24" y="384" font-size="11" fill="#616e7c">CARSI · Professional Moisture Meters · schematic, not to scale</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 524" width="800" height="524" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Pinless scan, then pin confirmation</title>
<desc id="d">Wall elevation. A pinless scan reads 15 to 18 on the reference scale except a 600 mm wet band at the base reading 80 to 95. Three pin points inside the band and one just outside confirm it. The pinless reading is weighted to the surface layers.</desc>
<rect width="800" height="524" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Pinless scan, then pin confirmation</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<rect x="40" y="90" width="440" height="300" fill="#d9dee3" stroke="#52606d" stroke-width="1.5"/>
<rect x="40" y="315" width="440" height="75" fill="#9ec5e8" stroke="#52606d" stroke-width="1.5"/>
<text x="60" y="140" font-size="13" fill="#1f2933">Rest of wall: 15–18 on the reference scale</text>
<text x="60" y="337" font-size="13" font-weight="700" fill="#1f2933">Band: 80–95 on the reference scale</text>
<circle cx="110" cy="372" r="6" fill="#c0392b" stroke="#1f2933" stroke-width="1.5"/>
<circle cx="260" cy="372" r="6" fill="#c0392b" stroke="#1f2933" stroke-width="1.5"/>
<circle cx="410" cy="372" r="6" fill="#c0392b" stroke="#1f2933" stroke-width="1.5"/>
<text x="122" y="376" font-size="12" fill="#1f2933">P1</text>
<text x="272" y="376" font-size="12" fill="#1f2933">P2</text>
<text x="422" y="376" font-size="12" fill="#1f2933">P3</text>
<circle cx="260" cy="298" r="6" fill="#2f855a" stroke="#1f2933" stroke-width="1.5"/>
<text x="272" y="302" font-size="12" fill="#1f2933">P4 (just outside)</text>
<line x1="500" y1="315" x2="500" y2="390" stroke="#52606d" stroke-width="2"/>
<line x1="494" y1="315" x2="506" y2="315" stroke="#52606d" stroke-width="2"/>
<line x1="494" y1="390" x2="506" y2="390" stroke="#52606d" stroke-width="2"/>
<text x="512" y="357" font-size="13" fill="#1f2933">600 mm</text>
<rect x="590" y="90" width="170" height="300" fill="#eef2f6" stroke="#52606d" stroke-width="1.5"/>
<text x="604" y="118" font-size="14" font-weight="700" fill="#1f2933">Why confirm?</text>
<text x="604" y="146" font-size="13" fill="#1f2933">The reading is</text>
<text x="604" y="166" font-size="13" fill="#1f2933">weighted to the</text>
<text x="604" y="186" font-size="13" fill="#1f2933">surface layers.</text>
<text x="604" y="226" font-size="13" fill="#1f2933">A dry skin over a</text>
<text x="604" y="246" font-size="13" fill="#1f2933">wet core can</text>
<text x="604" y="266" font-size="13" fill="#1f2933">read low.</text>
<text x="604" y="306" font-size="13" fill="#1f2933">Confirm with pins</text>
<text x="604" y="326" font-size="13" fill="#1f2933">at depth where</text>
<text x="604" y="346" font-size="13" fill="#1f2933">the decision</text>
<text x="604" y="366" font-size="13" fill="#1f2933">matters.</text>
<rect x="40" y="412" width="12" height="12" fill="#9ec5e8" stroke="#52606d" stroke-width="1.5"/>
<text x="60" y="423" font-size="12" fill="#1f2933">Wet band (pinless scan)</text>
<circle cx="240" cy="418" r="6" fill="#c0392b" stroke="#1f2933" stroke-width="1.5"/>
<text x="252" y="423" font-size="12" fill="#1f2933">Pin inside band</text>
<circle cx="380" cy="418" r="6" fill="#2f855a" stroke="#1f2933" stroke-width="1.5"/>
<text x="392" y="423" font-size="12" fill="#1f2933">Pin outside band</text>
<rect x="40" y="442" width="720" height="40" fill="#eef2f6" stroke="#52606d" stroke-width="1.5"/>
<text x="400" y="467" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Pinless finds the field fast; pins measure the spot at a known depth.</text>
<text x="24" y="510" font-size="12" fill="#3e4c59">CARSI · Professional Moisture Meters · schematic, not to scale</text>
</svg>

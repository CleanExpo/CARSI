<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Plasterboard: find the wet boundary</title>
<desc id="d">Vertical profile chart of plasterboard readings against height. Readings are 96, 88, 61, 24 and 14 points at 0, 200, 400, 600 and 800 millimetres. The baseline is 13 points and the wet boundary lies between 600 and 800 millimetres.</desc>
<rect width="800" height="480" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Plasterboard: find the wet boundary</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<rect x="130" y="100" width="440" height="75" fill="#fdecc8" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/><text x="562" y="142.5" font-size="13" font-weight="700" fill="#8a4b08" text-anchor="end">Wet boundary: 600 to 800 mm</text><line x1="130" y1="90" x2="130" y2="400" stroke="#52606d" stroke-width="1.5"/><line x1="130" y1="400" x2="570" y2="400" stroke="#52606d" stroke-width="1.5"/><line x1="124" y1="400" x2="130" y2="400" stroke="#52606d" stroke-width="1.5"/><text x="120" y="404" font-size="12" fill="#3e4c59" text-anchor="end">0 mm</text><line x1="124" y1="325" x2="130" y2="325" stroke="#52606d" stroke-width="1.5"/><text x="120" y="329" font-size="12" fill="#3e4c59" text-anchor="end">200 mm</text><line x1="124" y1="250" x2="130" y2="250" stroke="#52606d" stroke-width="1.5"/><text x="120" y="254" font-size="12" fill="#3e4c59" text-anchor="end">400 mm</text><line x1="124" y1="175" x2="130" y2="175" stroke="#52606d" stroke-width="1.5"/><text x="120" y="179" font-size="12" fill="#3e4c59" text-anchor="end">600 mm</text><line x1="124" y1="100" x2="130" y2="100" stroke="#52606d" stroke-width="1.5"/><text x="120" y="104" font-size="12" fill="#3e4c59" text-anchor="end">800 mm</text><line x1="130" y1="400" x2="130" y2="406" stroke="#52606d" stroke-width="1.5"/><text x="130" y="422" font-size="12" fill="#3e4c59" text-anchor="middle">0</text><line x1="240" y1="400" x2="240" y2="406" stroke="#52606d" stroke-width="1.5"/><text x="240" y="422" font-size="12" fill="#3e4c59" text-anchor="middle">25</text><line x1="350" y1="400" x2="350" y2="406" stroke="#52606d" stroke-width="1.5"/><text x="350" y="422" font-size="12" fill="#3e4c59" text-anchor="middle">50</text><line x1="460" y1="400" x2="460" y2="406" stroke="#52606d" stroke-width="1.5"/><text x="460" y="422" font-size="12" fill="#3e4c59" text-anchor="middle">75</text><line x1="570" y1="400" x2="570" y2="406" stroke="#52606d" stroke-width="1.5"/><text x="570" y="422" font-size="12" fill="#3e4c59" text-anchor="middle">100</text><text x="350" y="444" font-size="13" fill="#3e4c59" text-anchor="middle">Reading (points, reference scale)</text><text x="60" y="78" font-size="13" fill="#3e4c59">Height above floor</text><line x1="187.2" y1="90" x2="187.2" y2="400" stroke="#0b6e4f" stroke-width="2" stroke-dasharray="7 5"/><text x="195.2" y="390" font-size="13" font-weight="700" fill="#0b6e4f">Baseline 13</text><polyline points="552.4,400 517.2,325 398.4,250 235.6,175 191.60000000000002,100" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><circle cx="552.4" cy="400" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="1"/><text x="562.4" y="391" font-size="13" font-weight="700" fill="#1d4ed8">96</text><circle cx="517.2" cy="325" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="1"/><text x="527.2" y="316" font-size="13" font-weight="700" fill="#1d4ed8">88</text><circle cx="398.4" cy="250" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="1"/><text x="408.4" y="241" font-size="13" font-weight="700" fill="#1d4ed8">61</text><circle cx="235.6" cy="175" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="1"/><text x="245.6" y="166" font-size="13" font-weight="700" fill="#1d4ed8">24</text><circle cx="191.60000000000002" cy="100" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="1"/><text x="201.60000000000002" y="91" font-size="13" font-weight="700" fill="#1d4ed8">14</text><rect x="600" y="100" width="176" height="150" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1"/><text x="612" y="122" font-size="13" font-weight="700" fill="#1f2933">What to record</text><text x="612" y="142" font-size="12" fill="#3e4c59" font-weight="400">Baseline 13 points</text>
<text x="612" y="159" font-size="12" fill="#3e4c59" font-weight="400">(unaffected board).</text><text x="612" y="178" font-size="12" fill="#3e4c59" font-weight="400">Wet to about 700 mm;</text>
<text x="612" y="195" font-size="12" fill="#3e4c59" font-weight="400">boundary marked.</text><text x="612" y="214" font-size="12" fill="#3e4c59" font-weight="400">Re-read the baseline</text>
<text x="612" y="231" font-size="12" fill="#3e4c59" font-weight="400">every visit.</text>
<text x="24" y="466" font-size="11" fill="#3e4c59">CARSI · Professional Moisture Meters · schematic, not to scale</text>
</svg>

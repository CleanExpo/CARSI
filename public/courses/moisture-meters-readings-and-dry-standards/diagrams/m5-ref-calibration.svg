<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The daily check log: a pass row and a fail row</title>
<desc id="d">Layout of the daily check log with a passing Monday row and a failing Wednesday row, and the rule that a failed check means flagging every reading since the last good check.</desc>
<rect width="800" height="490" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">The daily check log: a pass row and a fail row</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect x="24" y="70" width="752" height="44" fill="#e8eef3" stroke="#52606d" stroke-width="1.5"/>
<text x="32" y="88" font-size="12" font-weight="700" fill="#1f2933">Date,</text>
<text x="32" y="104" font-size="12" font-weight="700" fill="#1f2933">time</text>
<text x="136" y="96" font-size="12" font-weight="700" fill="#1f2933">Instrument</text>
<text x="262" y="88" font-size="12" font-weight="700" fill="#1f2933">Check device or</text>
<text x="262" y="104" font-size="12" font-weight="700" fill="#1f2933">reference block</text>
<text x="438" y="96" font-size="12" font-weight="700" fill="#1f2933">Hygrometer pair</text>
<text x="592" y="96" font-size="12" font-weight="700" fill="#1f2933">Result</text>
<text x="662" y="96" font-size="12" font-weight="700" fill="#1f2933">Action</text>
<rect x="24" y="114" width="752" height="52" fill="#f3fbf7" stroke="#52606d" stroke-width="1.5"/>
<text x="32" y="145" font-size="12" fill="#1f2933">Mon 7:40 am</text>
<text x="136" y="135" font-size="12" fill="#1f2933">Pin meter 0421</text>
<text x="136" y="151" font-size="12" fill="#1f2933">Pinless 0388</text>
<text x="262" y="135" font-size="12" fill="#1f2933">Check device: OK</text>
<text x="262" y="151" font-size="12" fill="#1f2933">Reference block: OK</text>
<text x="438" y="135" font-size="12" fill="#1f2933">22.1 °C / 58 %RH</text>
<text x="438" y="151" font-size="12" fill="#1f2933">22.3 °C / 59 %RH</text>
<text x="592" y="145" font-size="12" font-weight="700" fill="#0b6e4f">PASS</text>
<text x="662" y="145" font-size="12" fill="#1f2933">Use today</text>
<rect x="24" y="166" width="752" height="52" fill="#fff6f5" stroke="#52606d" stroke-width="1.5"/>
<text x="32" y="197" font-size="12" fill="#1f2933">Wed 7:35 am</text>
<text x="136" y="197" font-size="12" fill="#1f2933">Pin meter 0421</text>
<text x="262" y="187" font-size="12" fill="#1f2933">Check device: FAIL</text>
<text x="262" y="203" font-size="12" fill="#1f2933">(battery, pins cleaned)</text>
<text x="438" y="197" font-size="12" fill="#1f2933">-</text>
<text x="592" y="197" font-size="12" font-weight="700" fill="#b42318">FAIL</text>
<text x="662" y="187" font-size="12" fill="#1f2933">Tag out and</text>
<text x="662" y="203" font-size="12" fill="#1f2933">swap meter</text>
<rect x="24" y="218" width="752" height="36" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
<text x="32" y="241" font-size="12" fill="#1f2933">...</text>
<path d="M128,70 L128,254" stroke="#52606d" stroke-width="1" fill="none"/>
<path d="M254,70 L254,254" stroke="#52606d" stroke-width="1" fill="none"/>
<path d="M430,70 L430,254" stroke="#52606d" stroke-width="1" fill="none"/>
<path d="M584,70 L584,254" stroke="#52606d" stroke-width="1" fill="none"/>
<path d="M654,70 L654,254" stroke="#52606d" stroke-width="1" fill="none"/>
<rect x="24" y="280" width="752" height="84" rx="8" fill="#fff6f5" stroke="#b42318" stroke-width="2"/>
<text x="36" y="306" font-size="14" font-weight="700" fill="#1f2933">Rule for a FAIL row (like Wednesday above)</text>
<text x="36" y="328" font-size="13" fill="#1f2933">Flag every reading taken since the last good check (Monday), including Tuesday’s,</text>
<text x="36" y="346" font-size="13" fill="#1f2933">so each can be re-read with a checked meter.</text>
<text x="24" y="392" font-size="14" font-weight="700" fill="#1f2933">Morning order</text>
<rect x="24" y="402" width="140" height="36" rx="8" fill="#f4f8fc" stroke="#1f5f8b" stroke-width="2"/>
<text x="36" y="425" font-size="13" font-weight="700" fill="#1f2933">1 Self-check</text>
<rect x="177" y="402" width="140" height="36" rx="8" fill="#f4f8fc" stroke="#1f5f8b" stroke-width="2"/>
<text x="189" y="425" font-size="13" font-weight="700" fill="#1f2933">2 Check device</text>
<rect x="330" y="402" width="140" height="36" rx="8" fill="#f4f8fc" stroke="#1f5f8b" stroke-width="2"/>
<text x="342" y="425" font-size="13" font-weight="700" fill="#1f2933">3 Reference block</text>
<rect x="483" y="402" width="140" height="36" rx="8" fill="#f4f8fc" stroke="#1f5f8b" stroke-width="2"/>
<text x="495" y="425" font-size="13" font-weight="700" fill="#1f2933">4 Hygrometers</text>
<rect x="636" y="402" width="140" height="36" rx="8" fill="#f4f8fc" stroke="#1f5f8b" stroke-width="2"/>
<text x="648" y="425" font-size="13" font-weight="700" fill="#1f2933">5 Log it</text>
<text x="24" y="476" font-size="11" fill="#7b8794">CARSI · Professional Moisture Meters · schematic, not to scale</text>
</svg>

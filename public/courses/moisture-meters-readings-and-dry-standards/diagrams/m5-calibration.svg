<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The morning check: five steps, then the log</title>
<desc id="d">Flow chart of the morning check: built-in self-check, pin meter on the check device, pinless meter on the reference block, two hygrometers settled side by side, then the log. A failed check leads to battery and cleaning, then tag-out and a checked meter, then flagging every reading since the last good check.</desc>
<rect width="800" height="520" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">The morning check: five steps, then the log</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect x="24" y="64" width="166" height="80" rx="8" fill="#f4f8fc" stroke="#1f5f8b" stroke-width="2"/>
<text x="36" y="90" font-size="14" font-weight="700" fill="#1f2933">1 Self-check</text>
<text x="36" y="112" font-size="12" fill="#3e4c59">Run the built-in</text>
<text x="36" y="128" font-size="12" fill="#3e4c59">test, if it has one</text>
<path d="M192,104 L218,104" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="220" y="64" width="166" height="80" rx="8" fill="#f4f8fc" stroke="#1f5f8b" stroke-width="2"/>
<text x="232" y="90" font-size="14" font-weight="700" fill="#1f2933">2 Pin meter</text>
<text x="232" y="112" font-size="12" fill="#3e4c59">On the maker’s</text>
<text x="232" y="128" font-size="12" fill="#3e4c59">check device</text>
<path d="M388,104 L414,104" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="416" y="64" width="166" height="80" rx="8" fill="#f4f8fc" stroke="#1f5f8b" stroke-width="2"/>
<text x="428" y="90" font-size="14" font-weight="700" fill="#1f2933">3 Pinless meter</text>
<text x="428" y="112" font-size="12" fill="#3e4c59">On the maker’s</text>
<text x="428" y="128" font-size="12" fill="#3e4c59">reference block</text>
<path d="M584,104 L610,104" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="612" y="64" width="166" height="80" rx="8" fill="#f4f8fc" stroke="#1f5f8b" stroke-width="2"/>
<text x="624" y="90" font-size="14" font-weight="700" fill="#1f2933">4 Hygrometers</text>
<text x="624" y="112" font-size="12" fill="#3e4c59">Settle side by side</text>
<text x="624" y="128" font-size="12" fill="#3e4c59">in the same air</text>
<rect x="612" y="196" width="166" height="80" rx="8" fill="#f3fbf7" stroke="#0b6e4f" stroke-width="2"/>
<text x="624" y="222" font-size="14" font-weight="700" fill="#1f2933">5 Write it down</text>
<text x="624" y="244" font-size="12" fill="#3e4c59">Date, time, serial no.,</text>
<text x="624" y="260" font-size="12" fill="#3e4c59">result, initials</text>
<path d="M695,146 L695,194" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="703" y="176" font-size="12" font-weight="700" fill="#0b6e4f">all pass</text>
<rect x="24" y="196" width="360" height="80" rx="8" fill="#fff6f5" stroke="#b42318" stroke-width="2"/>
<text x="36" y="222" font-size="14" font-weight="700" fill="#1f2933">A check fails</text>
<text x="36" y="244" font-size="12" fill="#3e4c59">Replace the battery, clean the pins or plate,</text>
<text x="36" y="260" font-size="12" fill="#3e4c59">then check again.</text>
<path d="M303,146 L303,194" stroke="#b42318" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="311" y="176" font-size="12" font-weight="700" fill="#b42318">a check fails</text>
<rect x="24" y="316" width="360" height="80" rx="8" fill="#fff6f5" stroke="#b42318" stroke-width="2"/>
<text x="36" y="342" font-size="14" font-weight="700" fill="#1f2933">Still failing: tag it out</text>
<text x="36" y="364" font-size="12" fill="#3e4c59">Use a checked meter and send the failed</text>
<text x="36" y="380" font-size="12" fill="#3e4c59">one to the maker or a service agent.</text>
<path d="M204,278 L204,314" stroke="#b42318" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="416" y="316" width="362" height="80" rx="8" fill="#f5f7fa" stroke="#52606d" stroke-width="2"/>
<text x="428" y="342" font-size="14" font-weight="700" fill="#1f2933">Back-up only</text>
<text x="428" y="364" font-size="12" fill="#3e4c59">Comparing two moisture meters is the weakest</text>
<text x="428" y="380" font-size="12" fill="#3e4c59">check: both can be wrong the same way.</text>
<rect x="24" y="436" width="754" height="44" rx="8" fill="#fffaf3" stroke="#b54708" stroke-width="2"/>
<text x="36" y="462" font-size="13" font-weight="700" fill="#1f2933">Flag every reading taken since the last good check, so each can be re-read with a checked meter.</text>
<path d="M204,398 L204,434" stroke="#b54708" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="24" y="506" font-size="11" fill="#7b8794">CARSI · Professional Moisture Meters · schematic, not to scale</text>
</svg>

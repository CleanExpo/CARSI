<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Pin moisture meter: pull-apart view</title>
<desc id="d">Pull-apart view of a generic pin moisture meter: 1 pins driven into the material, 2 probe head that holds the pins at a fixed spacing, 3 lead, 4 meter body reading in percent or on a wood-moisture-equivalent scale, 5 battery. A cross-section shows two pins in timber; the meter reads the electrical resistance between them, and wetter timber conducts more. Hobart example from the moisture-mapping lesson, illustrative: unaffected skirting of the same timber reads 12 percent, the dry standard; wet skirting reads 28 percent. Use the same meter and mode every visit and record both. A non-invasive meter shows where moisture is without pinholes; a pin meter measures how wet a material is.</desc>
<rect width="800" height="680" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Pin moisture meter: pull-apart view</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b6e4f"/></marker>
<linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef3"/></linearGradient>
<linearGradient id="gWarn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#fde6c8"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3fbf7"/><stop offset="1" stop-color="#d3eee2"/></linearGradient>
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fc"/><stop offset="1" stop-color="#d6e5f2"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6f5"/><stop offset="1" stop-color="#f9d7d3"/></linearGradient>
<linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3e3c8"/><stop offset="1" stop-color="#dcc29a"/></linearGradient>
<linearGradient id="gMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e7eb"/><stop offset="1" stop-color="#9aa5b1"/></linearGradient>
<radialGradient id="gDot" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#2fa77c"/><stop offset="1" stop-color="#0a5c42"/></radialGradient>
<radialGradient id="gDotW" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#e07a2c"/><stop offset="1" stop-color="#8f3806"/></radialGradient>
<radialGradient id="gDotB" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#4b8cc0"/><stop offset="1" stop-color="#174a6e"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dx="0" dy="3" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<text x="24" y="62" font-size="12" fill="#52606d">A generic pin (resistance) meter with a hand probe, pulled apart. Not a specific brand.</text>
<rect x="76" y="110" width="8" height="70" fill="url(#gMetal)" stroke="#52606d" stroke-width="1.5"/>
<polygon points="76,180 84,180 80,200" fill="#7b8794" stroke="#52606d" stroke-width="1"/>
<rect x="106" y="110" width="8" height="70" fill="url(#gMetal)" stroke="#52606d" stroke-width="1.5"/>
<polygon points="106,180 114,180 110,200" fill="#7b8794" stroke="#52606d" stroke-width="1"/>
<rect x="210" y="120" width="70" height="80" rx="10" fill="url(#gCard)" stroke="#52606d" stroke-width="2"/>
<circle cx="232" cy="190" r="5" fill="#7b8794"/>
<circle cx="258" cy="190" r="5" fill="#7b8794"/>
<path d="M340,200 C360,110 400,230 430,140" fill="none" stroke="#1f2933" stroke-width="4"/>
<rect x="424" y="120" width="16" height="22" rx="3" fill="url(#gMetal)" stroke="#52606d" stroke-width="1.5"/>
<rect x="505" y="90" width="80" height="140" rx="14" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2"/>
<rect x="515" y="104" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#0b6e4f" stroke-width="1.5"/>
<text x="545" y="131" font-size="16" font-weight="700" text-anchor="middle" fill="#0b6e4f">28 %</text>
<circle cx="528" cy="168" r="8" fill="#ffffff" stroke="#1f5f8b" stroke-width="1.5"/>
<circle cx="562" cy="194" r="8" fill="#ffffff" stroke="#1f5f8b" stroke-width="1.5"/>
<rect x="665" y="135" width="60" height="32" rx="4" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="2"/>
<rect x="725" y="144" width="6" height="14" fill="#0b6e4f"/>
<text x="95" y="266" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">1 Pins</text>
<text x="95" y="284" font-size="12" text-anchor="middle" fill="#52606d">Driven into the</text>
<text x="95" y="300" font-size="12" text-anchor="middle" fill="#52606d">material</text>
<text x="245" y="266" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">2 Probe head</text>
<text x="245" y="284" font-size="12" text-anchor="middle" fill="#52606d">Holds the pins at</text>
<text x="245" y="300" font-size="12" text-anchor="middle" fill="#52606d">a fixed spacing</text>
<text x="395" y="266" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">3 Lead</text>
<text x="395" y="284" font-size="12" text-anchor="middle" fill="#52606d">Carries the signal</text>
<text x="395" y="300" font-size="12" text-anchor="middle" fill="#52606d">to the meter</text>
<text x="545" y="266" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">4 Meter body</text>
<text x="545" y="284" font-size="12" text-anchor="middle" fill="#52606d">Reads in % or on a</text>
<text x="545" y="300" font-size="12" text-anchor="middle" fill="#52606d">wood-moisture-</text>
<text x="545" y="316" font-size="12" text-anchor="middle" fill="#52606d">equivalent scale</text>
<text x="695" y="266" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">5 Battery</text>
<text x="695" y="284" font-size="12" text-anchor="middle" fill="#52606d">The meter is</text>
<text x="695" y="300" font-size="12" text-anchor="middle" fill="#52606d">battery-powered</text>
<rect x="24" y="336" width="368" height="216" rx="10" fill="url(#gCard)" stroke="#52606d" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="360" font-size="14" font-weight="700" fill="#1f2933">How a pin reading works</text>
<rect x="56" y="432" width="304" height="64" fill="url(#gWood)" stroke="#8d6e3f" stroke-width="2"/>
<rect x="156" y="392" width="8" height="84" fill="url(#gMetal)" stroke="#52606d" stroke-width="1.5"/>
<rect x="252" y="392" width="8" height="84" fill="url(#gMetal)" stroke="#52606d" stroke-width="1.5"/>
<path d="M164,476 Q208,488 252,476" fill="none" stroke="#1f5f8b" stroke-width="2.5" stroke-dasharray="5 3"/>
<text x="56" y="516" font-size="12" fill="#1f2933">The meter reads the electrical resistance between</text>
<text x="56" y="532" font-size="12" fill="#1f2933">the pins. Wetter timber conducts more: higher reading.</text>
<text x="56" y="384" font-size="12" fill="#52606d">Pins in timber (cross-section)</text>
<rect x="408" y="336" width="368" height="216" rx="10" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="2" filter="url(#sh)"/>
<text x="424" y="360" font-size="14" font-weight="700" fill="#1f2933">Hobart example, mapping lesson (illustrative)</text>
<text x="424" y="382" font-size="12" fill="#1f2933">Unaffected skirting, same timber: 12 %.</text>
<text x="424" y="400" font-size="12" fill="#1f2933">That is the dry standard.</text>
<text x="424" y="418" font-size="12" fill="#1f2933">Wet skirting by the valve: 28 %.</text>
<text x="424" y="436" font-size="12" fill="#1f2933">Same meter, same mode, every visit;</text>
<text x="424" y="454" font-size="12" fill="#1f2933">record both beside each reading.</text>
<text x="424" y="472" font-size="12" fill="#1f2933">Calibrate to the maker's instructions.</text>
<rect x="24" y="568" width="752" height="76" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="592" font-size="14" font-weight="700" fill="#1f2933">Pin meter or non-invasive meter?</text>
<text x="40" y="614" font-size="12" fill="#1f2933">A non-invasive (capacitance or radio-frequency) meter scans the surface with no pinholes and shows where</text>
<text x="40" y="632" font-size="12" fill="#1f2933">moisture is. A pin meter measures how wet one material is. Confirm what a thermal camera suggests with a meter.</text>
<text x="776" y="668" font-size="12" text-anchor="end" fill="#52606d">CARSI · Water Restoration Practitioner · schematic, not to scale</text>
</svg>

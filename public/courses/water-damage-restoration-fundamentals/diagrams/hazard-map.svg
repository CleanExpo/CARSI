<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Hazard map: walk the room first</title>
<desc id="d">A schematic plan of a flooded room with six numbered hazards and the first control for each. 1 electrical: a power board and 230 V GPO beside standing water; isolate the supply, confirm dead, use an RCD and tested-and-tagged leads. 2 biological: Category 2 and 3 water carries micro-organisms and sewage is a biohazard. 3 slips, trips and falls: wet floors, trailing leads and ladders. 4 structural: a saturated ceiling holding water overhead. 5 chemical: cleaning and antimicrobial products, read the SDS. 6 confined spaces and heat: subfloors, roof voids and hot drying environments. If a hazard cannot be controlled, stop and escalate.</desc>
<rect width="800" height="580" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Hazard map: walk the room first</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b6e4f"/></marker>
<marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b54708"/></marker>
<marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef3"/></linearGradient>
<linearGradient id="gWarn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#fde6c8"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3fbf7"/><stop offset="1" stop-color="#d3eee2"/></linearGradient>
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fc"/><stop offset="1" stop-color="#d6e5f2"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6f5"/><stop offset="1" stop-color="#f9d7d3"/></linearGradient>
<linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcebf7"/><stop offset="1" stop-color="#b9d6ee"/></linearGradient>
<radialGradient id="gDot" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#2fa77c"/><stop offset="1" stop-color="#0a5c42"/></radialGradient>
<radialGradient id="gDotW" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#e07a2c"/><stop offset="1" stop-color="#8f3806"/></radialGradient>
<radialGradient id="gDotB" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#4b8cc0"/><stop offset="1" stop-color="#174a6e"/></radialGradient>
<radialGradient id="gDotR" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#d0564a"/><stop offset="1" stop-color="#912018"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dx="0" dy="3" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="24" y="64" width="404" height="410" rx="4" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="88" font-size="13" font-weight="700" fill="#1f2933">Flooded room (plan view)</text>
<rect x="44" y="214" width="272" height="240" rx="40" fill="url(#gWater)" stroke="#1f5f8b" stroke-width="1.5"/>
<text x="230" y="438" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5f8b">standing water</text>
<rect x="48" y="132" width="84" height="34" rx="4" fill="#ffffff" stroke="#6b7785" stroke-width="1.5"/>
<text x="90" y="153" font-size="12" text-anchor="middle" fill="#1f2933">bar fridge</text>
<rect x="246" y="146" width="96" height="24" rx="4" fill="#3e4c59" stroke="#1f2933" stroke-width="1"/>
<text x="294" y="162" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">power board</text>
<rect x="404" y="146" width="18" height="24" rx="2" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
<line x1="342" y1="158" x2="404" y2="158" stroke="#1f2933" stroke-width="2"/>
<text x="420" y="192" font-size="12" font-weight="700" text-anchor="end" fill="#1f2933">230 V GPO</text>
<path d="M246,164 C214,206 170,198 132,160" stroke="#1f2933" stroke-width="2" fill="none"/>
<ellipse cx="150" cy="320" rx="86" ry="52" fill="none" stroke="#b42318" stroke-width="2" stroke-dasharray="6 4"/>
<text x="150" y="344" font-size="12" font-weight="700" text-anchor="middle" fill="#b42318">wet ceiling overhead</text>
<rect x="376" y="262" width="40" height="40" rx="5" fill="#ffffff" stroke="#6b7785" stroke-width="1.5"/>
<text x="396" y="287" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2933">SDS</text>
<rect x="376" y="368" width="40" height="40" rx="2" fill="#e4e9ee" stroke="#6b7785" stroke-width="1.5"/>
<line x1="380" y1="372" x2="412" y2="404" stroke="#6b7785" stroke-width="1.5"/>
<line x1="412" y1="372" x2="380" y2="404" stroke="#6b7785" stroke-width="1.5"/>
<text x="370" y="393" font-size="12" text-anchor="end" fill="#1f2933">subfloor</text>
<circle cx="374" cy="124" r="12" fill="url(#gDotR)" stroke="#ffffff" stroke-width="2"/>
<text x="374" y="127.9" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="210" cy="398" r="12" fill="url(#gDotR)" stroke="#ffffff" stroke-width="2"/>
<text x="210" y="401.9" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="190" cy="226" r="12" fill="url(#gDotW)" stroke="#ffffff" stroke-width="2"/>
<text x="190" y="229.9" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="150" cy="304" r="12" fill="url(#gDotR)" stroke="#ffffff" stroke-width="2"/>
<text x="150" y="307.9" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="396" cy="240" r="12" fill="url(#gDotW)" stroke="#ffffff" stroke-width="2"/>
<text x="396" y="243.9" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<circle cx="396" cy="436" r="12" fill="url(#gDotW)" stroke="#ffffff" stroke-width="2"/>
<text x="396" y="439.9" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
<rect x="448" y="64" width="328" height="62" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="1.5"/>
<circle cx="470" cy="95" r="12" fill="url(#gDotR)" stroke="#ffffff" stroke-width="2"/>
<text x="470" y="98.9" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="492" y="84" font-size="14" font-weight="700" fill="#1f2933">Electrical</text>
<text x="492" y="102" font-size="12" fill="#52606d">Isolate the 230 V supply, confirm dead;</text>
<text x="492" y="118" font-size="12" fill="#52606d">RCD and tested-and-tagged leads</text>
<rect x="448" y="134" width="328" height="62" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="1.5"/>
<circle cx="470" cy="165" r="12" fill="url(#gDotR)" stroke="#ffffff" stroke-width="2"/>
<text x="470" y="168.9" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="492" y="154" font-size="14" font-weight="700" fill="#1f2933">Biological</text>
<text x="492" y="172" font-size="12" fill="#52606d">Category 2 and 3 water carries micro-</text>
<text x="492" y="188" font-size="12" fill="#52606d">organisms; sewage is a biohazard</text>
<rect x="448" y="204" width="328" height="62" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="1.5"/>
<circle cx="470" cy="235" r="12" fill="url(#gDotW)" stroke="#ffffff" stroke-width="2"/>
<text x="470" y="238.9" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="492" y="224" font-size="14" font-weight="700" fill="#1f2933">Slips, trips and falls</text>
<text x="492" y="242" font-size="12" fill="#52606d">Wet floors, trailing leads</text>
<text x="492" y="258" font-size="12" fill="#52606d">and ladders</text>
<rect x="448" y="274" width="328" height="62" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="1.5"/>
<circle cx="470" cy="305" r="12" fill="url(#gDotR)" stroke="#ffffff" stroke-width="2"/>
<text x="470" y="308.9" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="492" y="294" font-size="14" font-weight="700" fill="#1f2933">Structural</text>
<text x="492" y="312" font-size="12" fill="#52606d">Saturated ceilings and floors can</text>
<text x="492" y="328" font-size="12" fill="#52606d">collapse; a wet ceiling is overhead</text>
<rect x="448" y="344" width="328" height="62" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="1.5"/>
<circle cx="470" cy="375" r="12" fill="url(#gDotW)" stroke="#ffffff" stroke-width="2"/>
<text x="470" y="378.9" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<text x="492" y="364" font-size="14" font-weight="700" fill="#1f2933">Chemical</text>
<text x="492" y="382" font-size="12" fill="#52606d">Cleaning and antimicrobial</text>
<text x="492" y="398" font-size="12" fill="#52606d">products: always read the SDS</text>
<rect x="448" y="414" width="328" height="62" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="1.5"/>
<circle cx="470" cy="445" r="12" fill="url(#gDotW)" stroke="#ffffff" stroke-width="2"/>
<text x="470" y="448.9" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
<text x="492" y="434" font-size="14" font-weight="700" fill="#1f2933">Confined spaces and heat</text>
<text x="492" y="452" font-size="12" fill="#52606d">Subfloors, roof voids and</text>
<text x="492" y="468" font-size="12" fill="#52606d">hot drying environments</text>
<rect x="24" y="490" width="752" height="48" rx="10" fill="url(#gRed)" stroke="#b42318" stroke-width="2"/>
<text x="40" y="510" font-size="12" font-weight="700" fill="#1f2933">Cannot control it? Stop and escalate: a licensed electrician or a structural engineer,</text>
<text x="40" y="527" font-size="12" fill="#1f2933">the Poisons Information Centre on 13 11 26 for a chemical exposure, or 000 in an emergency.</text>
<text x="776" y="568" font-size="12" fill="#52606d" text-anchor="end">CARSI · Water Restoration Practitioner · schematic, not to scale</text>
</svg>

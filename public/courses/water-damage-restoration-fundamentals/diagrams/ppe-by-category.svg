<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">PPE by water category</title>
<desc id="d">Three columns showing the PPE set growing as the water category rises. Category 1: safety footwear, gloves and eye protection, plus respiratory protection if disturbing dusty or already-mouldy material. Category 2 adds fluid-resistant gloves and a correctly fitted P2 respirator when generating aerosols or handling contaminated materials. Category 3 is full skin protection: fluid-resistant coveralls, gloves, boots and eye protection, with a P2 or higher respirator fit-tested and fit-checked each time, and everything contacted treated as contaminated. New items in each column are marked with a plus sign.</desc>
<rect width="800" height="560" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">PPE by water category</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b6e4f"/></marker>
<marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b54708"/></marker>
<marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef3"/></linearGradient>
<linearGradient id="gWarn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#fde6c8"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3fbf7"/><stop offset="1" stop-color="#d3eee2"/></linearGradient>
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fc"/><stop offset="1" stop-color="#d6e5f2"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6f5"/><stop offset="1" stop-color="#f9d7d3"/></linearGradient>
<linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcebf7"/><stop offset="1" stop-color="#b9d6ee"/></linearGradient>
<radialGradient id="gDot" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#2fa77c"/><stop offset="1" stop-color="#0a5c42"/></radialGradient>
<radialGradient id="gDotW" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#e07a2c"/><stop offset="1" stop-color="#8f3806"/></radialGradient>
<radialGradient id="gDotB" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#4b8cc0"/><stop offset="1" stop-color="#174a6e"/></radialGradient>
<radialGradient id="gDotR" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#d0564a"/><stop offset="1" stop-color="#912018"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dx="0" dy="3" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="24" y="210" width="232" height="210" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<text x="38" y="236" font-size="16" font-weight="700" fill="#1f2933">Category 1</text>
<text x="38" y="254" font-size="12" font-weight="700" fill="#1f5f8b">clean water</text>
<rect x="34" y="268" width="212" height="26" rx="6" fill="#f5f7f9" stroke="#c3cad2" stroke-width="1"/>
<text x="44" y="285" font-size="12" fill="#52606d">Safety footwear</text>
<rect x="34" y="300" width="212" height="26" rx="6" fill="#f5f7f9" stroke="#c3cad2" stroke-width="1"/>
<text x="44" y="317" font-size="12" fill="#52606d">Gloves</text>
<rect x="34" y="332" width="212" height="26" rx="6" fill="#f5f7f9" stroke="#c3cad2" stroke-width="1"/>
<text x="44" y="349" font-size="12" fill="#52606d">Eye protection</text>
<rect x="34" y="364" width="212" height="42" rx="6" fill="#ffffff" stroke="#6b7785" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="44" y="381" font-size="12" fill="#52606d">Respirator if disturbing dusty</text>
<text x="44" y="397" font-size="12" fill="#52606d">or already-mouldy material</text>
<rect x="284" y="162" width="232" height="258" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="2" filter="url(#sh)"/>
<text x="298" y="188" font-size="16" font-weight="700" fill="#1f2933">Category 2</text>
<text x="298" y="206" font-size="12" font-weight="700" fill="#b54708">grey water</text>
<rect x="294" y="220" width="212" height="26" rx="6" fill="#f5f7f9" stroke="#c3cad2" stroke-width="1"/>
<text x="304" y="237" font-size="12" fill="#52606d">Safety footwear</text>
<rect x="294" y="252" width="212" height="26" rx="6" fill="#f5f7f9" stroke="#c3cad2" stroke-width="1"/>
<text x="304" y="269" font-size="12" fill="#52606d">Gloves</text>
<rect x="294" y="284" width="212" height="26" rx="6" fill="#f5f7f9" stroke="#c3cad2" stroke-width="1"/>
<text x="304" y="301" font-size="12" fill="#52606d">Eye protection</text>
<rect x="294" y="316" width="212" height="26" rx="6" fill="#ffffff" stroke="#b54708" stroke-width="2"/>
<text x="304" y="333" font-size="12" font-weight="700" fill="#1f2933">+ Fluid-resistant gloves</text>
<rect x="294" y="348" width="212" height="58" rx="6" fill="#ffffff" stroke="#b54708" stroke-width="2"/>
<text x="304" y="365" font-size="12" font-weight="700" fill="#1f2933">+ Correctly fitted P2 respirator</text>
<text x="304" y="381" font-size="12" font-weight="700" fill="#1f2933">when generating aerosols or</text>
<text x="304" y="397" font-size="12" font-weight="700" fill="#1f2933">handling contaminated materials</text>
<rect x="544" y="130" width="232" height="290" rx="10" fill="url(#gRed)" stroke="#b42318" stroke-width="2" filter="url(#sh)"/>
<text x="558" y="156" font-size="16" font-weight="700" fill="#1f2933">Category 3</text>
<text x="558" y="174" font-size="12" font-weight="700" fill="#b42318">black water / sewage</text>
<rect x="554" y="188" width="212" height="26" rx="6" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
<text x="564" y="205" font-size="12" font-weight="700" fill="#1f2933">+ Fluid-resistant coveralls</text>
<rect x="554" y="220" width="212" height="26" rx="6" fill="#f5f7f9" stroke="#c3cad2" stroke-width="1"/>
<text x="564" y="237" font-size="12" fill="#52606d">Gloves</text>
<rect x="554" y="252" width="212" height="26" rx="6" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
<text x="564" y="269" font-size="12" font-weight="700" fill="#1f2933">+ Boots</text>
<rect x="554" y="284" width="212" height="26" rx="6" fill="#f5f7f9" stroke="#c3cad2" stroke-width="1"/>
<text x="564" y="301" font-size="12" fill="#52606d">Eye protection</text>
<rect x="554" y="316" width="212" height="42" rx="6" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
<text x="564" y="333" font-size="12" font-weight="700" fill="#1f2933">+ P2 or higher respirator, fit-</text>
<text x="564" y="349" font-size="12" font-weight="700" fill="#1f2933">tested and fit-checked each time</text>
<rect x="554" y="364" width="212" height="42" rx="6" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
<text x="564" y="381" font-size="12" font-weight="700" fill="#1f2933">+ Treat everything contacted</text>
<text x="564" y="397" font-size="12" font-weight="700" fill="#1f2933">as contaminated</text>
<path d="M140,210 L140,84 L660,84 L660,128" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="400" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2933">The PPE set grows as the category rises</text>
<rect x="24" y="438" width="752" height="82" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="462" font-size="14" font-weight="700" fill="#1f2933">A respirator only protects when it seals</text>
<text x="40" y="481" font-size="12" fill="#52606d">Fit-test it on the wearer before first use; fit-check it every time it goes on. Facial hair under the seal</text>
<text x="40" y="497" font-size="12" fill="#52606d">breaks it. PPE is the last line, after isolation and engineering controls. Record the PPE actually used.</text>
<text x="776" y="548" font-size="12" fill="#52606d" text-anchor="end">CARSI · Water Restoration Practitioner · schematic, not to scale</text>
</svg>

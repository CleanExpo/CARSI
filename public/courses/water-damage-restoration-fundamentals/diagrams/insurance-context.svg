<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Australian insurance context</title>
<desc id="d">The job file at the centre, which protects you and the client whoever pays and is also the claim document on an insured job, linked to five Australian realities: work to an agreed scope; changes such as extra drying days, removing a material or another trade authorised and recorded first; measured evidence of readings trending to a dry standard; quotes and invoices in AUD with GST where it applies, for example $1200 AUD plus $120 GST is $1320 AUD inc GST; and the Australian Consumer Law guarantees that services are provided with due care and skill and are fit for any purpose made known, so no over-claiming. A clear, dated, measured file is the best protection if the work is questioned, insured or not.</desc>
<rect width="800" height="560" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">The Australian insurance context</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b6e4f"/></marker>
<marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b54708"/></marker>
<marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef3"/></linearGradient>
<linearGradient id="gWarn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#fde6c8"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3fbf7"/><stop offset="1" stop-color="#d3eee2"/></linearGradient>
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fc"/><stop offset="1" stop-color="#d6e5f2"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6f5"/><stop offset="1" stop-color="#f9d7d3"/></linearGradient>
<linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcebf7"/><stop offset="1" stop-color="#b9d6ee"/></linearGradient>
<radialGradient id="gDot" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#2fa77c"/><stop offset="1" stop-color="#0a5c42"/></radialGradient>
<radialGradient id="gDotW" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#e07a2c"/><stop offset="1" stop-color="#8f3806"/></radialGradient>
<radialGradient id="gDotB" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#4b8cc0"/><stop offset="1" stop-color="#174a6e"/></radialGradient>
<radialGradient id="gDotR" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#d0564a"/><stop offset="1" stop-color="#912018"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dx="0" dy="3" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="300" y="214" width="200" height="84" rx="10" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="2" filter="url(#sh)"/>
<text x="400" y="248" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Job file</text>
<text x="400" y="270" font-size="12" text-anchor="middle" fill="#52606d">the claim document if insured</text>
<rect x="24" y="64" width="240" height="84" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="38" y="90" font-size="14" font-weight="700" fill="#1f2933">Agreed scope</text>
<text x="38" y="112" font-size="12" fill="#52606d">Work is usually carried out</text>
<text x="38" y="129" font-size="12" fill="#52606d">to an agreed scope</text>
<rect x="536" y="64" width="240" height="101" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="2" filter="url(#sh)"/>
<text x="550" y="90" font-size="14" font-weight="700" fill="#1f2933">Authorised changes</text>
<text x="550" y="112" font-size="12" fill="#52606d">Extra drying days, removing a</text>
<text x="550" y="129" font-size="12" fill="#52606d">material or another trade:</text>
<text x="550" y="146" font-size="12" fill="#52606d">authorised and recorded first</text>
<rect x="24" y="206" width="240" height="84" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<text x="38" y="232" font-size="14" font-weight="700" fill="#1f2933">Measured evidence</text>
<text x="38" y="254" font-size="12" fill="#52606d">Readings trending to a dry</text>
<text x="38" y="271" font-size="12" fill="#52606d">standard, not “it looks dry”</text>
<rect x="536" y="206" width="240" height="118" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="550" y="232" font-size="14" font-weight="700" fill="#1f2933">Pricing in AUD</text>
<text x="550" y="254" font-size="12" fill="#52606d">Quotes and invoices in AUD,</text>
<text x="550" y="271" font-size="12" fill="#52606d">noting GST where it applies:</text>
<text x="550" y="288" font-size="12" fill="#52606d">$1200 + $120 GST (10 %)</text>
<text x="550" y="305" font-size="12" fill="#52606d">= $1320 AUD inc GST</text>
<path d="M300,232 L282,232 L282,110 L264,110" stroke="#9aa5b1" stroke-width="2" fill="none"/>
<path d="M500,232 L518,232 L518,110 L536,110" stroke="#9aa5b1" stroke-width="2" fill="none"/>
<path d="M300,262 L264,262" stroke="#9aa5b1" stroke-width="2" fill="none"/>
<path d="M500,262 L536,262" stroke="#9aa5b1" stroke-width="2" fill="none"/>
<path d="M400,298 L400,346" stroke="#9aa5b1" stroke-width="2" fill="none"/>
<rect x="220" y="346" width="360" height="120" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<text x="234" y="372" font-size="14" font-weight="700" fill="#1f2933">Consumer guarantees</text>
<text x="234" y="394" font-size="12" fill="#1f2933">The Australian Consumer Law: services with</text>
<text x="234" y="411" font-size="12" fill="#1f2933">due care and skill, fit for any purpose made</text>
<text x="234" y="428" font-size="12" fill="#1f2933">known. No over-claiming: never promise</text>
<text x="234" y="445" font-size="12" fill="#1f2933">“sterilised” or a fixed dry time.</text>
<rect x="24" y="484" width="752" height="46" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2"/>
<text x="400" y="512" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">A clear, dated, measured file is your best protection if the work is questioned months later, insured or not.</text>
<text x="776" y="548" font-size="12" fill="#52606d" text-anchor="end">CARSI · Water Restoration Practitioner · schematic, not to scale</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Water categories: contamination</title>
<desc id="d">Three water categories. Category 1, clean water, from a sanitary source with no substantial contamination, such as a burst mains supply line, an overflowing tap or rainwater that has not passed through contaminated materials. Category 2, significantly contaminated grey water, that could cause discomfort or illness, such as dishwasher or washing-machine discharge or a toilet overflow with urine but no faeces. Category 3, grossly contaminated black water that may contain harmful agents, such as sewage, water from beyond the toilet trap or floodwater from rivers or the sea. Clean water can degrade toward Category 2 or 3 over time. When unsure, treat it as the worse category and reassess.</desc>
<rect width="800" height="540" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Water categories: contamination</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b6e4f"/></marker>
<marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b54708"/></marker>
<marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef3"/></linearGradient>
<linearGradient id="gWarn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#fde6c8"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3fbf7"/><stop offset="1" stop-color="#d3eee2"/></linearGradient>
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fc"/><stop offset="1" stop-color="#d6e5f2"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6f5"/><stop offset="1" stop-color="#f9d7d3"/></linearGradient>
<linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcebf7"/><stop offset="1" stop-color="#b9d6ee"/></linearGradient>
<radialGradient id="gDot" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#2fa77c"/><stop offset="1" stop-color="#0a5c42"/></radialGradient>
<radialGradient id="gDotW" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#e07a2c"/><stop offset="1" stop-color="#8f3806"/></radialGradient>
<radialGradient id="gDotB" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#4b8cc0"/><stop offset="1" stop-color="#174a6e"/></radialGradient>
<radialGradient id="gDotR" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#d0564a"/><stop offset="1" stop-color="#912018"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dx="0" dy="3" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="24" y="64" width="232" height="298" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<circle cx="50" cy="90" r="14" fill="url(#gDotB)" stroke="#ffffff" stroke-width="2"/>
<text x="50" y="94.4" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="72" y="96" font-size="16" font-weight="700" fill="#1f2933">Category 1</text>
<text x="38" y="128" font-size="14" font-weight="700" fill="#1f2933">Clean water</text>
<text x="38" y="150" font-size="12" fill="#52606d">Sanitary source, no</text>
<text x="38" y="166" font-size="12" fill="#52606d">substantial contamination</text>
<text x="38" y="236" font-size="12" font-weight="700" fill="#1f5f8b">Example sources</text>
<text x="38" y="256" font-size="12" fill="#1f2933">• Burst mains supply line</text>
<text x="38" y="273" font-size="12" fill="#1f2933">• Overflowing tap</text>
<text x="38" y="290" font-size="12" fill="#1f2933">• Rainwater not passed through</text>
<text x="38" y="307" font-size="12" fill="#1f2933">   contaminated materials</text>
<rect x="284" y="64" width="232" height="298" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="2" filter="url(#sh)"/>
<circle cx="310" cy="90" r="14" fill="url(#gDotW)" stroke="#ffffff" stroke-width="2"/>
<text x="310" y="94.4" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="332" y="96" font-size="16" font-weight="700" fill="#1f2933">Category 2</text>
<text x="298" y="128" font-size="14" font-weight="700" fill="#1f2933">Significantly contaminated</text>
<text x="298" y="146" font-size="14" font-weight="700" fill="#1f2933">(grey water)</text>
<text x="298" y="168" font-size="12" fill="#52606d">Could cause discomfort or</text>
<text x="298" y="184" font-size="12" fill="#52606d">illness if contacted or consumed</text>
<text x="298" y="236" font-size="12" font-weight="700" fill="#b54708">Example sources</text>
<text x="298" y="256" font-size="12" fill="#1f2933">• Dishwasher or washing-</text>
<text x="298" y="273" font-size="12" fill="#1f2933">   machine discharge</text>
<text x="298" y="290" font-size="12" fill="#1f2933">• Toilet overflow with urine</text>
<text x="298" y="307" font-size="12" fill="#1f2933">   but no faeces</text>
<rect x="544" y="64" width="232" height="298" rx="10" fill="url(#gRed)" stroke="#b42318" stroke-width="2" filter="url(#sh)"/>
<circle cx="570" cy="90" r="14" fill="url(#gDotR)" stroke="#ffffff" stroke-width="2"/>
<text x="570" y="94.4" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="592" y="96" font-size="16" font-weight="700" fill="#1f2933">Category 3</text>
<text x="558" y="128" font-size="14" font-weight="700" fill="#1f2933">Grossly contaminated</text>
<text x="558" y="146" font-size="14" font-weight="700" fill="#1f2933">(black water)</text>
<text x="558" y="168" font-size="12" fill="#52606d">May contain harmful agents</text>
<text x="558" y="236" font-size="12" font-weight="700" fill="#b42318">Example sources</text>
<text x="558" y="256" font-size="12" fill="#1f2933">• Sewage</text>
<text x="558" y="273" font-size="12" fill="#1f2933">• Water from beyond the</text>
<text x="558" y="290" font-size="12" fill="#1f2933">   toilet trap</text>
<text x="558" y="307" font-size="12" fill="#1f2933">• Floodwater from rivers</text>
<text x="558" y="324" font-size="12" fill="#1f2933">   or the sea</text>
<path d="M140,362 L140,388 L660,388 L660,364" stroke="#b54708" stroke-width="2" fill="none" marker-end="url(#arrowW)"/>
<text x="400" y="410" font-size="12" font-weight="700" text-anchor="middle" fill="#b54708">Can worsen over time: clean water left in a warm, closed building</text>
<text x="400" y="426" font-size="12" text-anchor="middle" fill="#52606d">degrades toward Category 2 or 3, so a later visit may land in a worse category.</text>
<rect x="24" y="444" width="752" height="64" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="470" font-size="14" font-weight="700" fill="#1f2933">Unsure? Treat it as the worse category and reassess.</text>
<text x="40" y="490" font-size="12" fill="#52606d">Record the reasons in the job file: the source, the materials contacted, the time elapsed and the building conditions.</text>
<text x="776" y="528" font-size="12" fill="#52606d" text-anchor="end">CARSI · Water Restoration Practitioner · schematic, not to scale</text>
</svg>

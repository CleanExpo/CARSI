<text x="95" y="266" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">1 Inlet and filter</text>
<text x="95" y="284" font-size="12" text-anchor="middle" fill="#52606d">Room air drawn in;</text>
<text x="95" y="300" font-size="12" text-anchor="middle" fill="#52606d">filter guards coils</text>
<text x="245" y="266" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">2 Cold coil</text>
<text x="245" y="284" font-size="12" text-anchor="middle" fill="#52606d">Air cools below its</text>
<text x="245" y="300" font-size="12" text-anchor="middle" fill="#52606d">dew point; water</text>
<text x="245" y="316" font-size="12" text-anchor="middle" fill="#52606d">condenses on fins</text>
<text x="395" y="266" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">3 Warm coil</text>
<text x="395" y="284" font-size="12" text-anchor="middle" fill="#52606d">Reheats the dried</text>
<text x="395" y="300" font-size="12" text-anchor="middle" fill="#52606d">air before it</text>
<text x="395" y="316" font-size="12" text-anchor="middle" fill="#52606d">leaves the unit</text>
<text x="545" y="266" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">4 Fan</text>
<text x="545" y="284" font-size="12" text-anchor="middle" fill="#52606d">Pulls air through</text>
<text x="545" y="300" font-size="12" text-anchor="middle" fill="#52606d">the coils</text>
<text x="695" y="266" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">5 Outlet</text>
<text x="695" y="284" font-size="12" text-anchor="middle" fill="#52606d">Drier air goes</text>
<text x="695" y="300" font-size="12" text-anchor="middle" fill="#52606d">back into the room</text>
<rect x="24" y="340" width="236" height="96" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="364" font-size="14" font-weight="700" fill="#1f2933">6 Condensate tray and pump</text>
<text x="40" y="386" font-size="12" fill="#1f2933">Water from the cold coil drips</text>
<text x="40" y="404" font-size="12" fill="#1f2933">into the tray; a pump or hose</text>
<text x="40" y="422" font-size="12" fill="#1f2933">sends it to a drain.</text>
<rect x="282" y="340" width="236" height="96" rx="10" fill="url(#gCard)" stroke="#52606d" stroke-width="2" filter="url(#sh)"/>
<text x="298" y="364" font-size="14" font-weight="700" fill="#1f2933">7 Compressor</text>
<text x="298" y="386" font-size="12" fill="#1f2933">Pumps refrigerant around the</text>
<text x="298" y="404" font-size="12" fill="#1f2933">circuit, keeping one coil cold</text>
<text x="298" y="422" font-size="12" fill="#1f2933">and the other warm.</text>
<rect x="540" y="340" width="236" height="96" rx="10" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="2" filter="url(#sh)"/>
<text x="556" y="364" font-size="14" font-weight="700" fill="#1f2933">8 Lead and plug, 230 V</text>
<text x="556" y="386" font-size="12" fill="#1f2933">10 A plug; tested and tagged;</text>
<text x="556" y="404" font-size="12" fill="#1f2933">run through an RCD. Read the</text>
<text x="556" y="422" font-size="12" fill="#1f2933">rating plate for the amps.</text>
<rect x="24" y="456" width="752" height="104" rx="10" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="480" font-size="14" font-weight="700" fill="#1f2933">What it does to the air (drying-equation lesson example; figures illustrative)</text>
<text x="40" y="502" font-size="12" fill="#1f2933">Room air at about 16 g/kg is conditioned to about 8.4 g/kg: about 7.6 g/kg removed from each kilogram of air.</text>
<text x="40" y="520" font-size="12" fill="#1f2933">On site: record inlet and outlet g/kg each visit; the outlet must read lower than the inlet.</text>
<text x="40" y="538" font-size="12" fill="#1f2933">Power: an LGR dehumidifier drawing 4.5 A at 230 V in the equipment lesson example; read the rating plate.</text>
<text x="776" y="588" font-size="12" text-anchor="end" fill="#52606d">CARSI · Water Restoration Practitioner · schematic, not to scale</text>
</svg>

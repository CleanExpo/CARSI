<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Refrigerant dehumidifier: pull-apart view</title>
<desc id="d">Pull-apart view of a generic refrigerant dehumidifier along its air path: 1 inlet grille and filter, 2 cold coil where air is cooled below its dew point and water condenses, 3 warm coil that reheats the dried air, 4 fan, 5 outlet. Below: 6 condensate tray and pump to a drain, 7 compressor that circulates refrigerant, 8 230 V lead and 10 A plug, tested and tagged, through an RCD. Lesson worked example: room air at about 16 g/kg is conditioned to about 8.4 g/kg, about 7.6 g/kg removed per kilogram of air; an LGR dehumidifier drawing 4.5 A at 230 V. Figures illustrative.</desc>
<rect width="800" height="600" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Refrigerant dehumidifier: pull-apart view</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>

<text x="291.2" y="259.3" font-size="14" font-weight="700" text-anchor="end" fill="#1f2933">E</text>
<text x="562.0" y="308.3" font-size="12" font-weight="700" fill="#0b6e4f">about 7.6 g/kg removed</text>
<rect x="24" y="470" width="752" height="190" rx="10" fill="url(#gCard)" stroke="#52606d" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="494" font-size="14" font-weight="700" fill="#1f2933">Reading the chart (figures from the lessons, illustrative)</text>
<text x="40" y="516" font-size="12" fill="#1f2933">A  Gold Coast room: 30 °C, 60 %RH, about 16 g/kg (drying-equation lesson).</text>
<text x="40" y="534" font-size="12" fill="#1f2933">B  The same air conditioned by the dehumidifier to 24 °C, 45 %RH, about 8.4 g/kg. A to B removes about 7.6 g/kg.</text>
<text x="40" y="552" font-size="12" fill="#1f2933">C  Sydney hallway: 24 °C, 70 %RH, about 13 g/kg (instruments lesson).</text>
<text x="40" y="570" font-size="12" fill="#1f2933">D  Unaffected room: 24 °C, 55 %RH, about 10 g/kg (instruments lesson).</text>
<text x="40" y="588" font-size="12" fill="#1f2933">E  Dew point of the hallway air, about 18 °C (instruments lesson): cool that air below it and water condenses.</text>
<text x="40" y="606" font-size="12" fill="#1f2933">%RH moves with temperature; g/kg is the water the air actually carries. C and D share a temperature,</text>
<text x="40" y="624" font-size="12" fill="#1f2933">but C carries about 3 g/kg more. Saturation line drawn for sea-level air pressure.</text>
<text x="776" y="688" font-size="12" text-anchor="end" fill="#52606d">CARSI · Water Restoration Practitioner · schematic, not to scale</text>
</svg>

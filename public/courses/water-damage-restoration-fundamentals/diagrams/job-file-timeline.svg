<text x="40" y="412" font-size="14" font-weight="700" fill="#1f2933">Day 3 example (Canberra)</text>
<text x="40" y="432" font-size="12" fill="#1f2933">Zone 24 °C, 55 %RH ≈ 10.2 g/kg; dehumidifier outlet ≈ 7 g/kg; wall points 28 % → 18 % against a 12 % dry standard.</text>
<rect x="24" y="466" width="752" height="62" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="490" font-size="14" font-weight="700" fill="#1f2933">Throughout: record each decision and who authorised it</text>
<text x="40" y="510" font-size="12" fill="#1f2933">Build the file as the job happens, not afterwards from memory. If it is not documented, it did not happen.</text>
<text x="776" y="548" font-size="12" fill="#52606d" text-anchor="end">CARSI · Water Restoration Practitioner · schematic, not to scale</text>

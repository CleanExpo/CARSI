<text x="95" y="266" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">1 Inlet grille</text>
<text x="95" y="284" font-size="12" text-anchor="middle" fill="#52606d">Room air drawn in</text>
<text x="95" y="300" font-size="12" text-anchor="middle" fill="#52606d">at the centre</text>
<text x="245" y="266" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">2 Fan wheel</text>
<text x="245" y="284" font-size="12" text-anchor="middle" fill="#52606d">Spins and flings</text>
<text x="245" y="300" font-size="12" text-anchor="middle" fill="#52606d">air outwards</text>
<text x="395" y="266" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">3 Motor</text>
<text x="395" y="284" font-size="12" text-anchor="middle" fill="#52606d">Runs on 230 V,</text>
<text x="395" y="300" font-size="12" text-anchor="middle" fill="#52606d">50 Hz</text>
<text x="545" y="266" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">4 Housing</text>
<text x="545" y="284" font-size="12" text-anchor="middle" fill="#52606d">Collects the air</text>
<text x="545" y="300" font-size="12" text-anchor="middle" fill="#52606d">and turns it</text>
<text x="695" y="266" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">5 Outlet</text>
<text x="695" y="284" font-size="12" text-anchor="middle" fill="#52606d">Low, wide jet</text>
<text x="695" y="300" font-size="12" text-anchor="middle" fill="#52606d">across the surface</text>
<rect x="24" y="336" width="368" height="132" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="360" font-size="14" font-weight="700" fill="#1f2933">What it does</text>
<text x="40" y="382" font-size="12" fill="#1f2933">Moves air across the wet surface to speed</text>
<text x="40" y="400" font-size="12" fill="#1f2933">evaporation. Pair it with dehumidification:</text>
<text x="40" y="418" font-size="12" fill="#1f2933">airflow alone lifts moisture into the room air</text>
<text x="40" y="436" font-size="12" fill="#1f2933">and stalls drying.</text>
<rect x="408" y="336" width="368" height="132" rx="10" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="2" filter="url(#sh)"/>
<text x="424" y="360" font-size="14" font-weight="700" fill="#1f2933">Power at 230 V</text>
<text x="424" y="382" font-size="12" fill="#1f2933">1.2 A each in the lesson example (illustrative;</text>
<text x="424" y="400" font-size="12" fill="#1f2933">read the rating plate). Add every machine on</text>
<text x="424" y="418" font-size="12" fill="#1f2933">a circuit; keep the total under 10 A with</text>
<text x="424" y="436" font-size="12" fill="#1f2933">headroom. Tested and tagged, through an RCD.</text>
<rect x="24" y="484" width="752" height="76" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="508" font-size="14" font-weight="700" fill="#1f2933">The mould rule</text>
<text x="40" y="530" font-size="12" fill="#1f2933">Visible mould present? Do not run air movers: airflow spreads spores. Use air filtration and dehumidifiers</text>
<text x="40" y="548" font-size="12" fill="#1f2933">only, under containment, until remediation and a clearance confirm the mould has been dealt with.</text>
<text x="776" y="588" font-size="12" text-anchor="end" fill="#52606d">CARSI · Water Restoration Practitioner · schematic, not to scale</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Air mover: pull-apart view</title>
<desc id="d">Pull-apart view of a generic centrifugal air mover along its shaft: 1 inlet grille, 2 fan wheel, 3 230 V motor, 4 housing that collects and turns the air, 5 outlet that sends a low, wide jet across the wet surface. It speeds evaporation and must be paired with dehumidification. Lesson example draw 1.2 A each at 230 V, illustrative; keep each 10 A circuit under its limit. Mould rule: if visible mould is present, do not run air movers.</desc>
<rect width="800" height="600" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Air mover: pull-apart view</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The four drying levers</title>
<desc id="d">Four levers control the rate of drying: evaporation, where moving air across a wet surface speeds evaporation; dehumidification, which removes the evaporated moisture from the air using refrigerant or desiccant dehumidifiers; temperature, since warmer air holds and releases moisture more readily within sensible limits; and air exchange or containment. Moisture released from wet materials into the room air must be balanced by moisture removed. Airflow without dehumidification raises the humidity and stalls drying. Worked example: room air at 30 °C and 60 %RH carries about 16 g/kg; dehumidifier outlet air at about 24 °C and 45 %RH carries about 8.4 g/kg, about 7.6 g/kg removed.</desc>
<rect width="800" height="540" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">The four drying levers</text>
<image x="656" y="14" width="120" height="31" href="data:image/png;base64,"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b6e4f"/></marker>
<marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b54708"/></marker>
<marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
<linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef3"/></linearGradient>
<linearGradient id="gWarn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#fde6c8"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3fbf7"/><stop offset="1" stop-color="#d3eee2"/></linearGradient>
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fc"/><stop offset="1" stop-color="#d6e5f2"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6f5"/><stop offset="1" stop-color="#f9d7d3"/></linearGradient>
<linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcebf7"/><stop offset="1" stop-color="#b9d6ee"/></linearGradient>
<radialGradient id="gDot" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#2fa77c"/><stop offset="1" stop-color="#0a5c42"/></radialGradient>
<radialGradient id="gDotW" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#e07a2c"/><stop offset="1" stop-color="#8f3806"/></radialGradient>
<radialGradient id="gDotB" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#4b8cc0"/><stop offset="1" stop-color="#174a6e"/></radialGradient>
<radialGradient id="gDotR" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#d0564a"/><stop offset="1" stop-color="#912018"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dx="0" dy="3" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="24" y="64" width="170" height="140" rx="10" fill="url(#gGreen)" stroke="#0b6e4f" stroke-width="2" filter="url(#sh)"/>
<circle cx="46" cy="88" r="12" fill="url(#gDot)" stroke="#ffffff" stroke-width="2"/>
<text x="46" y="91.9" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="66" y="93" font-size="14" font-weight="700" fill="#1f2933">Evaporation</text>
<text x="38" y="146" font-size="12" fill="#52606d">Moving air across a</text>
<text x="38" y="163" font-size="12" fill="#52606d">wet surface speeds</text>
<text x="38" y="180" font-size="12" fill="#52606d">evaporation (air movers)</text>
<rect x="218" y="64" width="170" height="140" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<circle cx="240" cy="88" r="12" fill="url(#gDotB)" stroke="#ffffff" stroke-width="2"/>
<text x="240" y="91.9" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="260" y="93" font-size="14" font-weight="700" fill="#1f2933">Dehumidification</text>
<text x="232" y="146" font-size="12" fill="#52606d">Removes the evaporated</text>
<text x="232" y="163" font-size="12" fill="#52606d">moisture from the air</text>
<text x="232" y="180" font-size="12" fill="#52606d">(refrigerant or desiccant)</text>
<rect x="412" y="64" width="170" height="140" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="2" filter="url(#sh)"/>
<circle cx="434" cy="88" r="12" fill="url(#gDotW)" stroke="#ffffff" stroke-width="2"/>
<text x="434" y="91.9" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="454" y="93" font-size="14" font-weight="700" fill="#1f2933">Temperature</text>
<text x="426" y="146" font-size="12" fill="#52606d">Warmer air holds and</text>
<text x="426" y="163" font-size="12" fill="#52606d">releases moisture more</text>
<text x="426" y="180" font-size="12" fill="#52606d">readily, within limits</text>
<rect x="606" y="64" width="170" height="140" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<circle cx="628" cy="88" r="12" fill="url(#gDotB)" stroke="#ffffff" stroke-width="2"/>
<text x="628" y="91.9" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="648" y="93" font-size="14" font-weight="700" fill="#1f2933">Air exchange</text>
<text x="648" y="111" font-size="14" font-weight="700" fill="#1f2933">or containment</text>
<text x="620" y="146" font-size="12" fill="#52606d">Drier outside air in, or</text>
<text x="620" y="163" font-size="12" fill="#52606d">seal the area so your</text>
<text x="620" y="180" font-size="12" fill="#52606d">equipment controls it</text>
<rect x="24" y="228" width="180" height="76" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="114.0" y="260" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Wet materials</text>
<text x="114.0" y="284" font-size="12" text-anchor="middle" fill="#52606d">release moisture</text>
<rect x="310" y="228" width="180" height="76" rx="10" fill="url(#gWarn)" stroke="#b54708" stroke-width="2" filter="url(#sh)"/>
<text x="400.0" y="260" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Room air</text>
<text x="400.0" y="284" font-size="12" text-anchor="middle" fill="#52606d">track it in g/kg</text>
<rect x="596" y="228" width="180" height="76" rx="10" fill="url(#gBlue)" stroke="#1f5f8b" stroke-width="2" filter="url(#sh)"/>
<text x="686.0" y="260" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Moisture removed</text>
<text x="686.0" y="284" font-size="12" text-anchor="middle" fill="#52606d">dehumidifier or exchange</text>
<path d="M204,276.0 L308,276.0" stroke="#0b6e4f" stroke-width="2" fill="none" marker-end="url(#arrowG)"/>
<text x="257" y="266.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0b6e4f">moisture in</text>
<path d="M490,276.0 L594,276.0" stroke="#1f5f8b" stroke-width="2" fill="none" marker-end="url(#arrowB)"/>
<text x="543" y="266.0" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5f8b">moisture out</text>
<text x="257" y="300.0" font-size="12" text-anchor="middle" fill="#52606d">evaporation</text>
<rect x="24" y="324" width="752" height="60" rx="10" fill="url(#gRed)" stroke="#b42318" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="348" font-size="12" font-weight="700" fill="#1f2933">Airflow without dehumidification raises the room humidity and stalls drying;</text>
<text x="40" y="365" font-size="12" fill="#1f2933">in a closed, humid space it risks condensation and mould.</text>
<rect x="24" y="400" width="752" height="96" rx="10" fill="url(#gCard)" stroke="#9aa5b1" stroke-width="2" filter="url(#sh)"/>
<text x="40" y="424" font-size="14" font-weight="700" fill="#1f2933">Prove it in g/kg (Gold Coast example)</text>
<text x="40" y="444" font-size="12" fill="#1f2933">Room air 30 °C, 60 %RH: about 16 g/kg. Dehumidifier outlet about 24 °C, 45 %RH: about 8.4 g/kg.</text>
<text x="40" y="461" font-size="12" fill="#1f2933">About 16 − 8.4 = 7.6 g/kg removed from each kilogram of air. The outlet must read lower than the inlet.</text>
<text x="40" y="478" font-size="12" fill="#52606d">RH moves with temperature; g/kg shows how much water the air carries. Outside g/kg is context, not proof.</text>
<text x="776" y="528" font-size="12" fill="#52606d" text-anchor="end">CARSI · Water Restoration Practitioner · schematic, not to scale</text>
</svg>

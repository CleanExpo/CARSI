<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The laundry as full containment</title>
<desc id="d">Floor plan: sealed laundry work area with a scrubber exhausting out of the window, a sealed vent, an airlock at the kitchen door and a protected clean path.</desc>
<rect width="800" height="380" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">The laundry as full containment</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect x="60" y="70" width="380" height="270" fill="#f5f7fa" stroke="#1f2933" stroke-width="3"/><text x="250" y="96" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Laundry = work area (sealed)</text><rect x="440" y="230" width="110" height="110" fill="#fff4e5" stroke="#b54708" stroke-width="2" stroke-dasharray="6 4"/><text x="495" y="285" font-size="13" font-weight="700" fill="#b54708" text-anchor="middle">Airlock</text><rect x="550" y="230" width="210" height="110" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/><text x="655" y="275" font-size="13" fill="#1f2933" text-anchor="middle">Kitchen (occupied)</text><text x="655" y="295" font-size="11" fill="#52606d" text-anchor="middle">floor protection on clean path</text><rect x="150" y="62" width="110" height="16" fill="#cfe3ff" stroke="#1f2933"/><text x="205" y="58" font-size="11" fill="#52606d" text-anchor="middle">window: exhaust out</text><rect x="180" y="150" width="60" height="40" rx="6" fill="#0b6e4f"/><text x="210" y="175" font-size="11" fill="#fff" text-anchor="middle">scrubber</text><path d="M210,150 L210,82" stroke="#0b6e4f" stroke-width="6" fill="none"/><rect x="330" y="110" width="40" height="20" fill="#fff" stroke="#b54708"/><text x="350" y="146" font-size="10" fill="#b54708" text-anchor="middle">vent sealed</text><line x1="600" y1="285" x2="556" y2="285" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><line x1="490" y1="250" x2="446" y2="250" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="222" font-size="11" fill="#52606d">air leaks inwards →</text><text x="80" y="330" font-size="11" fill="#52606d">2.6 m × 1.9 m × 2.4 m = 11.86 m³</text>
<text x="776" y="368" font-size="11" fill="#52606d" text-anchor="end">CARSI · Level 2 Mould Remediation · schematic, not to scale</text>
</svg>

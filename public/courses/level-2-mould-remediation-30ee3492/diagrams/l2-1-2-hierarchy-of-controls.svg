<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 394" width="800" height="394" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Hierarchy of controls on a mould job</title>
<desc id="d">Five levels of control from elimination to PPE with a mould example on each.</desc>
<rect width="800" height="394" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Hierarchy of controls on a mould job</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect x="24" y="64" width="752" height="52" rx="8" fill="#0b6e4f"/><text x="40" y="86" font-size="15" font-weight="700" fill="#fff">Eliminate</text><text x="40" y="106" font-size="12" fill="#fff">Fix the leak. Remove colonised material.</text><rect x="59" y="124" width="682" height="52" rx="8" fill="#2f855a"/><text x="75" y="146" font-size="15" font-weight="700" fill="#fff">Substitute</text><text x="75" y="166" font-size="12" fill="#fff">Choose a less dusty method, such as hand cutting.</text><rect x="94" y="184" width="612" height="52" rx="8" fill="#4a9d6e"/><text x="110" y="206" font-size="15" font-weight="700" fill="#fff">Isolate and engineer</text><text x="110" y="226" font-size="12" fill="#fff">Containment, negative air, HEPA vacuums.</text><rect x="129" y="244" width="542" height="52" rx="8" fill="#b7791f"/><text x="145" y="266" font-size="15" font-weight="700" fill="#fff">Administer</text><text x="145" y="286" font-size="12" fill="#fff">SWMS, limited entry, signs, training, supervision.</text><rect x="164" y="304" width="472" height="52" rx="8" fill="#b54708"/><text x="180" y="326" font-size="15" font-weight="700" fill="#fff">PPE</text><text x="180" y="346" font-size="12" fill="#fff">Fit-tested respirator, coveralls, gloves, eye protection.</text><text x="24" y="382" font-size="12" fill="#52606d">Most effective at the top. Use more than one level.</text>
<text x="776" y="382" font-size="11" fill="#52606d" text-anchor="end">CARSI · Level 2 Mould Remediation · schematic, not to scale</text>
</svg>

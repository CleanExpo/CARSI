<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 216" width="800" height="216" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The cleaning sequence</title>
<desc id="d">HEPA vacuum, damp wipe, dry, HEPA vacuum, torch check; top to bottom, clean to dirty.</desc>
<rect width="800" height="216" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">The cleaning sequence</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect x="-68" y="64" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="-50" cy="82" r="12" fill="#0b6e4f"/><text x="-50" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="20" y="94" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">HEPA vacuum</text><text x="12" y="130" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">brush tool, slowly</text><line x1="94" y1="110" x2="122" y2="110" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="126" y="64" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="144" cy="82" r="12" fill="#0b6e4f"/><text x="144" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="214" y="94" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Damp wipe</text><text x="206" y="130" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">detergent, 8 cloth</text><text x="206" y="144" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">faces</text><line x1="288" y1="110" x2="316" y2="110" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="64" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="338" cy="82" r="12" fill="#0b6e4f"/><text x="338" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="408" y="94" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Let it dry</text><text x="400" y="130" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">do not soak the frame</text><line x1="482" y1="110" x2="510" y2="110" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="514" y="64" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="532" cy="82" r="12" fill="#0b6e4f"/><text x="532" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="602" y="94" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">HEPA again</text><text x="594" y="130" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">second pass</text><line x1="676" y1="110" x2="704" y2="110" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="708" y="64" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="726" cy="82" r="12" fill="#0b6e4f"/><text x="726" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="796" y="94" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Torch check</text><text x="788" y="130" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">held flat to surface</text>
<text x="776" y="204" font-size="11" fill="#52606d" text-anchor="end">CARSI · Level 2 Mould Remediation · schematic, not to scale</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 348" width="800" height="348" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Don in the clean area, doff in the airlock</title>
<desc id="d">Donning then doffing order, with the respirator removed last after leaving the airlock.</desc>
<rect width="800" height="348" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Don in the clean area, doff in the airlock</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect x="29" y="64" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="47" cy="82" r="12" fill="#0b6e4f"/><text x="47" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="117" y="94" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Don: coveralls</text><text x="109" y="130" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">clean area</text><line x1="191" y1="110" x2="219" y2="110" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="223" y="64" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="241" cy="82" r="12" fill="#0b6e4f"/><text x="241" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="311" y="94" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Don: respirator</text><text x="303" y="130" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">fit check every time</text><line x1="385" y1="110" x2="413" y2="110" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="417" y="64" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="435" cy="82" r="12" fill="#0b6e4f"/><text x="435" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="505" y="94" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Don: hood, eyes</text><text x="497" y="130" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">then overshoes</text><line x1="579" y1="110" x2="607" y2="110" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="611" y="64" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="629" cy="82" r="12" fill="#0b6e4f"/><text x="629" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="699" y="94" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Don: gloves</text><text x="691" y="130" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">inner, then outer</text><path d="M691,158 L691,176 L109,176 L109,192" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="29" y="196" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="47" cy="214" r="12" fill="#0b6e4f"/><text x="47" y="219" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="117" y="226" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Doff: outer</text><text x="117" y="244" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">gloves</text><text x="109" y="262" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">in the airlock</text><line x1="191" y1="242" x2="219" y2="242" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="223" y="196" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="241" cy="214" r="12" fill="#0b6e4f"/><text x="241" y="219" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="311" y="226" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Doff: coveralls</text><text x="303" y="262" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">roll inside out</text><line x1="385" y1="242" x2="413" y2="242" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="417" y="196" width="160" height="92" rx="10" fill="#fff4e5" stroke="#b54708" stroke-width="2"/><circle cx="435" cy="214" r="12" fill="#b54708"/><text x="435" y="219" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="505" y="226" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Doff: respirator</text><text x="497" y="262" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">after leaving the</text><text x="497" y="276" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">airlock</text><line x1="579" y1="242" x2="607" y2="242" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="611" y="196" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="629" cy="214" r="12" fill="#0b6e4f"/><text x="629" y="219" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="699" y="226" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Inner gloves,</text><text x="699" y="244" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">wash</text><text x="691" y="262" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">hands and face</text>
<text x="776" y="336" font-size="11" fill="#52606d" text-anchor="end">CARSI · Level 2 Mould Remediation · schematic, not to scale</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Negative air</title>
<desc id="d">A containment with a HEPA air scrubber ducted outside; arrows show air leaking into the containment at the door flap from the rest of the house.</desc>
<rect width="800" height="340" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Negative air</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect x="80" y="80" width="420" height="220" fill="#f5f7fa" stroke="#1f2933" stroke-width="3"/><text x="290" y="106" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Containment: lower pressure</text><rect x="130" y="200" width="90" height="60" rx="8" fill="#0b6e4f"/><text x="175" y="228" font-size="12" fill="#fff" text-anchor="middle">air scrubber</text><text x="175" y="246" font-size="11" fill="#fff" text-anchor="middle">HEPA</text><path d="M175,200 L175,140 L60,140" stroke="#0b6e4f" stroke-width="8" fill="none" marker-end="url(#arrow)"/><text x="40" y="128" font-size="12" fill="#0b6e4f">exhaust outside</text><rect x="500" y="170" width="10" height="80" fill="#fff" stroke="#b54708" stroke-width="2"/><text x="520" y="160" font-size="12" fill="#b54708">door flap</text><line x1="640" y1="185" x2="520" y2="185" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><line x1="640" y1="210" x2="520" y2="210" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><line x1="640" y1="235" x2="520" y2="235" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="215" font-size="13" fill="#1f2933">rest of house</text><text x="650" y="233" font-size="11" fill="#52606d">smoke drawn in = working</text><text x="100" y="290" font-size="12" fill="#52606d">volume × air changes ÷ real airflow = scrubbers needed</text>
<text x="776" y="328" font-size="11" fill="#52606d" text-anchor="end">CARSI · Level 2 Mould Remediation · schematic, not to scale</text>
</svg>

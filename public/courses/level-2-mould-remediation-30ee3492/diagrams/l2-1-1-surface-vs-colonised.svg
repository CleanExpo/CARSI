<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Surface growth or colonised material?</title>
<desc id="d">Cross-section of a wall comparing surface growth on the face with growth on the back of the plasterboard and on the stud.</desc>
<rect width="800" height="340" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Surface growth or colonised material?</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<text x="200" y="70" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Surface growth (Level 1)</text><rect x="120" y="90" width="22" height="200" fill="#e6e1d6" stroke="#9aa5b1"/><rect x="142" y="90" width="12" height="200" fill="#ffffff" stroke="#9aa5b1"/><circle cx="158" cy="150" r="3" fill="#5b4636"/><circle cx="161" cy="159" r="3" fill="#5b4636"/><circle cx="164" cy="168" r="3" fill="#5b4636"/><circle cx="158" cy="177" r="3" fill="#5b4636"/><circle cx="161" cy="186" r="3" fill="#5b4636"/><circle cx="164" cy="195" r="3" fill="#5b4636"/><circle cx="158" cy="204" r="3" fill="#5b4636"/><circle cx="161" cy="213" r="3" fill="#5b4636"/><circle cx="164" cy="222" r="3" fill="#5b4636"/><text x="260" y="150" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">Growth sits on the</text><text x="260" y="168" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">painted face. Clean it</text><text x="260" y="186" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">and check the cause.</text><text x="590" y="70" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Colonised material (Level 2)</text><rect x="470" y="90" width="40" height="200" fill="#c9a66b" stroke="#9aa5b1"/><text x="490" y="305" font-size="11" fill="#52606d" text-anchor="middle">stud</text><rect x="510" y="90" width="14" height="200" fill="#e6e1d6" stroke="#9aa5b1"/><rect x="524" y="90" width="8" height="200" fill="#ffffff" stroke="#9aa5b1"/><text x="520" y="305" font-size="11" fill="#52606d" text-anchor="middle">board</text><rect x="470" y="200" width="62" height="90" fill="#d8e9f5" opacity="0.6"/><circle cx="506" cy="210" r="3" fill="#5b4636"/><circle cx="511" cy="210" r="3" fill="#5b4636"/><circle cx="516" cy="210" r="3" fill="#5b4636"/><circle cx="521" cy="210" r="3" fill="#5b4636"/><circle cx="506" cy="223" r="3" fill="#5b4636"/><circle cx="511" cy="223" r="3" fill="#5b4636"/><circle cx="516" cy="223" r="3" fill="#5b4636"/><circle cx="521" cy="223" r="3" fill="#5b4636"/><circle cx="506" cy="236" r="3" fill="#5b4636"/><circle cx="511" cy="236" r="3" fill="#5b4636"/><circle cx="516" cy="236" r="3" fill="#5b4636"/><circle cx="521" cy="236" r="3" fill="#5b4636"/><circle cx="506" cy="249" r="3" fill="#5b4636"/><circle cx="511" cy="249" r="3" fill="#5b4636"/><circle cx="516" cy="249" r="3" fill="#5b4636"/><circle cx="521" cy="249" r="3" fill="#5b4636"/><circle cx="506" cy="262" r="3" fill="#5b4636"/><circle cx="511" cy="262" r="3" fill="#5b4636"/><circle cx="516" cy="262" r="3" fill="#5b4636"/><circle cx="521" cy="262" r="3" fill="#5b4636"/><circle cx="506" cy="275" r="3" fill="#5b4636"/><circle cx="511" cy="275" r="3" fill="#5b4636"/><circle cx="516" cy="275" r="3" fill="#5b4636"/><circle cx="521" cy="275" r="3" fill="#5b4636"/><text x="560" y="200" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">Growth on the back of</text><text x="560" y="218" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">the board and on the</text><text x="560" y="236" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">stud. The face may look</text><text x="560" y="254" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">almost clean.</text><text x="490" y="330" font-size="11" fill="#52606d" text-anchor="middle">wet zone shaded</text>
<text x="776" y="328" font-size="11" fill="#52606d" text-anchor="end">CARSI · Level 2 Mould Remediation · schematic, not to scale</text>
</svg>

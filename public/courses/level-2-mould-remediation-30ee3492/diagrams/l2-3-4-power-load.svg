<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 288" width="800" height="288" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Spread the load across circuits</title>
<desc id="d">Two 10 amp circuits at 230 volts with machines shared so each stays below its rating.</desc>
<rect width="800" height="288" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Spread the load across circuits</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect x="24" y="64" width="240" height="194" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><rect x="24" y="64" width="240" height="40" rx="10" fill="#0b6e4f"/><text x="144" y="90" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Circuit 1 (10 A, RCD)</text><text x="38" y="130" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Air scrubber 2.5 A</text><text x="38" y="176" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Dehumidifier 4.5 A</text><text x="38" y="222" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Total 7.0 A: OK</text><rect x="280" y="64" width="240" height="194" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><rect x="280" y="64" width="240" height="40" rx="10" fill="#0b6e4f"/><text x="400" y="90" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Circuit 2 (10 A, RCD)</text><text x="294" y="130" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Air mover 1.2 A</text><text x="294" y="176" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Air mover 1.2 A</text><text x="294" y="222" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Total 2.4 A: OK</text><rect x="536" y="64" width="240" height="194" rx="10" fill="#f5f7fa" stroke="#b54708" stroke-width="2"/><rect x="536" y="64" width="240" height="40" rx="10" fill="#b54708"/><text x="656" y="90" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">All on one circuit</text><text x="550" y="130" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• 2.5 + 4.5 + 1.2 + 1.2</text><text x="550" y="176" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Total 9.4 A</text><text x="550" y="222" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Too close to 10 A: split it</text>
<text x="776" y="276" font-size="11" fill="#52606d" text-anchor="end">CARSI · Level 2 Mould Remediation · schematic, not to scale</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 348" width="800" height="348" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">From your checks to clearance</title>
<desc id="d">Crew checks, then independent verification; pass to clearance, fail back to cleaning.</desc>
<rect width="800" height="348" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">From your checks to clearance</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect x="126" y="64" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="144" cy="82" r="12" fill="#0b6e4f"/><text x="144" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="214" y="94" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Crew checks</text><text x="206" y="130" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">torch, odour, readings</text><line x1="288" y1="110" x2="316" y2="110" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="64" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="338" cy="82" r="12" fill="#0b6e4f"/><text x="338" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="408" y="94" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Book verifier</text><text x="400" y="130" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">independent IEP</text><line x1="482" y1="110" x2="510" y2="110" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="514" y="64" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="532" cy="82" r="12" fill="#0b6e4f"/><text x="532" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="602" y="94" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Verification</text><text x="594" y="130" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">containment still up</text><path d="M594,158 L594,176 L206,176 L206,192" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="126" y="196" width="160" height="92" rx="10" fill="#fff4e5" stroke="#b54708" stroke-width="2"/><circle cx="144" cy="214" r="12" fill="#b54708"/><text x="144" y="219" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="214" y="226" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Fail: clean</text><text x="214" y="244" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">again</text><text x="206" y="262" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">then re-verify</text><line x1="288" y1="242" x2="316" y2="242" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="196" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="338" cy="214" r="12" fill="#0b6e4f"/><text x="338" y="219" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="408" y="226" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Pass: clearance</text><text x="400" y="262" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">written result</text><line x1="482" y1="242" x2="510" y2="242" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="514" y="196" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="532" cy="214" r="12" fill="#0b6e4f"/><text x="532" y="219" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="602" y="226" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Containment down</text><text x="594" y="262" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">release to builder</text>
<text x="776" y="336" font-size="11" fill="#52606d" text-anchor="end">CARSI · Level 2 Mould Remediation · schematic, not to scale</text>
</svg>

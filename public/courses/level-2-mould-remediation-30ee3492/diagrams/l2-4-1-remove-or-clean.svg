<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 334" width="800" height="334" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Remove or clean? Decide by material</title>
<desc id="d">Porous materials removed, semi-porous framing cleaned, non-porous surfaces cleaned.</desc>
<rect width="800" height="334" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2933">Remove or clean? Decide by material</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect x="24" y="64" width="240" height="240" rx="10" fill="#f5f7fa" stroke="#b54708" stroke-width="2"/><rect x="24" y="64" width="240" height="40" rx="10" fill="#b54708"/><text x="144" y="90" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Porous: remove</text><text x="38" y="130" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Paper-faced plasterboard</text><text x="38" y="176" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Insulation</text><text x="38" y="222" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Carpet and underlay</text><text x="38" y="268" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Swollen particleboard, MDF</text><rect x="280" y="64" width="240" height="240" rx="10" fill="#f5f7fa" stroke="#b7791f" stroke-width="2"/><rect x="280" y="64" width="240" height="40" rx="10" fill="#b7791f"/><text x="400" y="90" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Framing: clean</text><text x="294" y="130" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• HEPA vacuum</text><text x="294" y="176" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Wire brush or shrouded sand</text><text x="294" y="222" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Damp wipe</text><text x="294" y="268" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Soft or rotten: builder</text><rect x="536" y="64" width="240" height="240" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><rect x="536" y="64" width="240" height="40" rx="10" fill="#0b6e4f"/><text x="656" y="90" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Non-porous: clean</text><text x="550" y="130" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Tiles and glass</text><text x="550" y="176" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Metal</text><text x="550" y="222" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Sealed benchtops</text><text x="550" y="268" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">• Grout with growth: replace</text>
<text x="776" y="322" font-size="11" fill="#52606d" text-anchor="end">CARSI · Level 2 Mould Remediation · schematic, not to scale</text>
</svg>

<rect x="29" y="64" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="47" cy="82" r="12" fill="#0b6e4f"/><text x="47" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="117" y="94" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">First look</text><text x="109" y="130" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">photos with scale</text><line x1="191" y1="110" x2="219" y2="110" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="223" y="64" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="241" cy="82" r="12" fill="#0b6e4f"/><text x="241" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="311" y="94" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Inspection</text><text x="303" y="130" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">cause of the water</text><line x1="385" y1="110" x2="413" y2="110" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="417" y="64" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="435" cy="82" r="12" fill="#0b6e4f"/><text x="435" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="505" y="94" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Scope</text><text x="497" y="130" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">and every change</text><line x1="579" y1="110" x2="607" y2="110" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="611" y="64" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="629" cy="82" r="12" fill="#0b6e4f"/><text x="629" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="699" y="94" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">SWMS, PPE</text><text x="691" y="130" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">sign-on, fit tests</text><path d="M691,158 L691,176 L109,176 L109,192" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="29" y="196" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="47" cy="214" r="12" fill="#0b6e4f"/><text x="47" y="219" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="117" y="226" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Containment</text><text x="109" y="262" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">checks, smoke tests</text><line x1="191" y1="242" x2="219" y2="242" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="223" y="196" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="241" cy="214" r="12" fill="#0b6e4f"/><text x="241" y="219" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="311" y="226" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Moisture</text><text x="303" y="262" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">map and drying log</text><line x1="385" y1="242" x2="413" y2="242" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="417" y="196" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="435" cy="214" r="12" fill="#0b6e4f"/><text x="435" y="219" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="505" y="226" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Products, waste</text><text x="497" y="262" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">records and SDSs</text><line x1="579" y1="242" x2="607" y2="242" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/><rect x="611" y="196" width="160" height="92" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/><circle cx="629" cy="214" r="12" fill="#0b6e4f"/><text x="629" y="219" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="699" y="226" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Verification</text><text x="691" y="262" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">and signed handover</text>
<text x="776" y="336" font-size="11" fill="#52606d" text-anchor="end">CARSI · Level 2 Mould Remediation · schematic, not to scale</text>

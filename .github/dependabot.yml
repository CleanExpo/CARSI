# Dependabot: weekly, grouped, capped so it cannot flood the repo with PRs.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Australia/Brisbane"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Australia/Brisbane"
    open-pull-requests-limit: 3
    groups:
      # All codeql-action steps (init, analyze, ...) must run the same version,
      # majors included, or CodeQL fails with a configuration error (GP-722).
      # Listed first: Dependabot puts a dependency in the first group it matches.
      codeql-action:
        patterns: ["github/codeql-action*"]
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"

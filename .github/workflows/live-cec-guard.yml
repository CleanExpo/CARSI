name: Live CEC Compliance Guard

# Guards against unapproved IICRC CEC claims reappearing on the live site (GP-498/GP-519) —
# stale prod-DB `cec_hours` values that the repo-file scans (`check:iicrc-compliance`) cannot
# see, because the exposure lives in persisted prod data, not the repo.
#
# THE CHECK NOW RUNS INSIDE THE APP, NOT ON THE RUNNER.
# GitHub's runners cannot reach the production database: the DigitalOcean trusted-source list
# is two IPs plus `monkfish-app`, so a runner-side connection returns `P1008 SocketTimeout`
# and asserts nothing about production. This job therefore calls an authenticated cron route
# on the deployed app, which IS on the right side of that allowlist. GitHub needs only HTTPS.
#
# `CARSI_PROD_DATABASE_URL` is no longer read by this workflow, or by any other.
#
# Setup (one-time, founder):
#   1. Repo Settings → Secrets → Actions → CRON_SECRET must match the app's CRON_SECRET env
#      var on DigitalOcean. It already does — the recert/toolbox/homepage cron workflows have
#      been running green on this same secret.
#   2. Repo Settings → Variables → Actions → LIVE_CEC_CHECK = true. Already set.
#
# Reading a failure:
#   409  the guard RAN and production is publishing CEC claims the registry does not back.
#        The offending slugs are printed in the response body below (--fail-with-body).
#   500  the guard could NOT run (no DATABASE_URL on the app, or the read threw). This is a
#        failure to assert, not a clean bill of health, and is deliberately red.
#   503  CRON_SECRET is not set on the app.  401  the secret here does not match the app's.

on:
  schedule:
    # Daily, 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-cec-guard:
    name: Live CEC Compliance Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.LIVE_CEC_CHECK == 'true' }}
    steps:
      - name: Assert no unapproved CEC claims in prod
        # --fail-with-body, not bare -f: a bare -f discards the response body, which is where
        # the offending course slugs are. A red run with no slugs in the log is unactionable.
        run: |
          curl --fail-with-body -sS --max-time 120 -X GET \
            "https://carsi.com.au/api/cron/live-cec-check" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

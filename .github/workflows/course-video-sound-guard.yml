name: Course Video Sound Guard

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/seed/courses-catalog.json'
      - 'scripts/check-course-video-sound*.mjs'
      - 'scripts/lib/is-entry-point.mjs'
      - '.github/workflows/course-video-sound-guard.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  catalogue:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg and ffprobe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test sound guard
        run: node --test scripts/check-course-video-sound.test.mjs
      - name: Check catalogue videos
        run: node scripts/check-course-video-sound.mjs --catalog

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg and ffprobe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check live course videos
        run: node scripts/check-course-video-sound.mjs --live

name: Live Buy-Path Guard

# GP-638. Reads PRODUCTION and fails if the two 8 Oct 2026 buying-path faults come back:
#   - a local origin (localhost:8080 etc.) in a public page, a redirect, or the sign-out redirect;
#   - an enrol-form field whose text is (nearly) the colour of its background.
# NO CREDENTIALS: it reads public pages only, so it is not gated behind a repo variable.
#
# EXIT CODES, and why the job fails on both 1 and 2:
#   0  clean AND non-vacuous (pages, form fields and both sign-out redirects were read)
#   1  a fault was found
#   2  could not audit, including a form colour it could not judge (for example a colour format
#      the browser could not convert). "I could not look" must never render as "nothing is wrong".
#
# Not on push, for the same reason as live-catalogue-guard.yml: its verdict is about the live
# site, not the pull request. After changing the guard, run it by hand:
#   gh workflow run live-buy-path-guard.yml --ref <branch>

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-buy-path-guard
  cancel-in-progress: false

jobs:
  live-buy-path-guard:
    name: Live Buy-Path Guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove the guard's own rules still fire
        run: node scripts/check-live-buy-path.test.mjs

      # The browser half needs Playwright and Chromium. `npm ci --ignore-scripts` installs the
      # app's packages too (slower, but it pins the exact Playwright version the repo uses).
      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Audit the live buying path
        run: node scripts/check-live-buy-path.mjs

name: check-visuals
on:
  pull_request:
    paths: ["**/*.tsx", "**/*.jsx", "**/*.ts", "**/*.js", "**/*.mdx", "**/*.html", "**/*.astro", "**/*.vue", "**/*.svelte", "**/*.css", "**/*.scss", "**/*.sass", "**/*.less", "**/public/**", "media.manifest.json", "visuals.config.json", "scripts/premium-visuals/**", ".github/workflows/check-visuals.yml"]
permissions:
  contents: read
jobs:
  check-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Mode comes from visuals.config.json ("report" = list findings, never fail; "enforce" = fail the PR on any finding).
      # Exit 2 = configuration error and fails in both modes. Neither mode is visual acceptance (see AGENTS.md).
      # The path list must cover every extension the scanner reads; src/lib/premium-visuals/check-visuals.test.ts checks it.
      - run: node scripts/premium-visuals/check-visuals.mjs --root .

name: Security Scanning

on:
  push:
    branches: [main, codex/margot-conversation-ownership]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly security scans on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  snyk-frontend:
    name: Snyk Frontend Security Scan (Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.SNYK_ENABLED == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=package.json

      - name: Upload Snyk report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snyk-frontend-report
          path: snyk-report.json
          retention-days: 30

  # snyk-backend job removed 2026-06-29 — referenced a phantom apps/backend/
  # pyproject.toml (CARSI is a single Next.js app, not a monorepo). It was
  # gated behind SNYK_ENABLED and would have failed if ever enabled.

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0  # LGPL-3.0 dropped — only hit is @img/sharp-libvips (Next.js image codec, dynamically linked; LGPL permits proprietary use; main already ships it at 1.2.4). See #659

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Threshold raised from `critical` to `high` on 2026-08-07. It sat at `critical` while the
      # tree carried 5 HIGH and 0 critical advisories — Next.js SSRF in rewrites, DoS in Server
      # Actions, unauthenticated disclosure of internal Server Function endpoints, postcss XSS,
      # sharp libvips CVEs, undici request smuggling — so every one of them passed the gate.
      #
      # Raised only after the tree was cleared, never before: `next` 16.2.9 -> 16.3.0 (a
      # non-major fix per npm's own fixAvailable) plus a non-forced `npm audit fix` took
      # production advisories from 11 (5 high) to 5 (0 high, 0 critical). Verified after a FULL
      # install: tsc 0, lint 0, 138 test files / 999 tests, `next build` exit 0.
      #
      # Scoped to production dependencies. Dev-only advisories should not block a deploy, and
      # scanning them here would re-create the pressure to weaken the threshold.
      - name: Run npm audit (production deps, fail on high or critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Generate audit report
        if: always()
        run: npm audit --json > npm-audit-report.json
        continue-on-error: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30

  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          limit-severities-for-sarif: 'true'

      - name: Test Trivy severity gate
        if: always()
        run: node --test scripts/trivy-policy.test.mjs

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-scan-results
          path: trivy-results.sarif
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [npm-audit, trivy-scan]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      - name: Test security summary truthfulness
        run: node --test scripts/security-scan-summary.test.mjs

      - name: Display security scan results
        if: always()
        env:
          NPM_AUDIT_RESULT: ${{ needs.npm-audit.result }}
          TRIVY_RESULT: ${{ needs.trivy-scan.result }}
        run: node scripts/security-scan-summary.mjs

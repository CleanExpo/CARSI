name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly security scans on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  snyk-frontend:
    name: Snyk Frontend Security Scan (Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.SNYK_ENABLED == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=package.json

      - name: Upload Snyk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-frontend-report
          path: snyk-report.json
          retention-days: 30

  # snyk-backend job removed 2026-06-29 — referenced a phantom apps/backend/
  # pyproject.toml (CARSI is a single Next.js app, not a monorepo). It was
  # gated behind SNYK_ENABLED and would have failed if ever enabled.

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0  # LGPL-3.0 dropped — only hit is @img/sharp-libvips (Next.js image codec, dynamically linked; LGPL permits proprietary use; main already ships it at 1.2.4). See #659

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Threshold raised from `critical` to `high` on 2026-08-07. It sat at `critical` while the
      # tree carried 5 HIGH and 0 critical advisories — Next.js SSRF in rewrites, DoS in Server
      # Actions, unauthenticated disclosure of internal Server Function endpoints, postcss XSS,
      # sharp libvips CVEs, undici request smuggling — so every one of them passed the gate.
      #
      # Raised only after the tree was cleared, never before: `next` 16.2.9 -> 16.3.0 (a
      # non-major fix per npm's own fixAvailable) plus a non-forced `npm audit fix` took
      # production advisories from 11 (5 high) to 5 (0 high, 0 critical). Verified after a FULL
      # install: tsc 0, lint 0, 138 test files / 999 tests, `next build` exit 0.
      #
      # Scoped to production dependencies. Dev-only advisories should not block a deploy, and
      # scanning them here would re-create the pressure to weaken the threshold.
      - name: Run npm audit (production deps, fail on high or critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Generate audit report
        if: always()
        run: npm audit --json > npm-audit-report.json
        continue-on-error: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30

  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.sarif
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [npm-audit, trivy-scan]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display security scan results
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Required Scans Completed:" >> $GITHUB_STEP_SUMMARY
          echo "- [PASS] NPM Audit (no token required)" >> $GITHUB_STEP_SUMMARY
          echo "- [PASS] Trivy Container Scan (no token required)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Optional Scans:" >> $GITHUB_STEP_SUMMARY
          echo "- [OPT] Snyk Security Scans (requires SNYK_TOKEN secret)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All required security scans completed successfully." >> $GITHUB_STEP_SUMMARY
          echo "Please review the artifact reports for detailed findings." >> $GITHUB_STEP_SUMMARY
